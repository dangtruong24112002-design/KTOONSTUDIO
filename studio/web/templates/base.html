<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Studio OS{% endblock %}</title>
<script src="/static/htmx.min.js"></script>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
    --accent: #b4441e; --accent-soft: #fbeee8; --ok: #2f7a3e; --ok-soft: #e8f4ea;
    --warn: #9a6a00; --warn-soft: #fdf4dc; --bad: #b3261e; --bad-soft: #fde8e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  header { background: var(--ink); color: #fff; }
  header .wrap { display: flex; align-items: center; gap: 28px; padding: 12px 24px; max-width: 1400px; margin: 0 auto; }
  header .brand { font-weight: 700; letter-spacing: .02em; }
  header .brand small { font-weight: 400; opacity: .6; margin-left: 6px; }
  header nav a { color: #fff; opacity: .7; text-decoration: none; margin-right: 18px; }
  header nav a.on, header nav a:hover { opacity: 1; border-bottom: 2px solid var(--accent); padding-bottom: 2px; }
  main { max-width: 1400px; margin: 0 auto; padding: 24px; }
  .grid { display: grid; grid-template-columns: minmax(340px, 1fr) 2fr; gap: 20px; align-items: start; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 16px; margin: 0 0 12px; }
  .panel h2 .step { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
                    color: #fff; font-size: 12px; text-align: center; line-height: 22px; margin-right: 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 26px 14px; text-align: center; cursor: pointer;
          transition: .15s; color: var(--muted); }
  .drop.over, .drop:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .drop strong { color: var(--ink); display: block; font-size: 15px; margin-bottom: 4px; }
  textarea, input[type=text], select { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line);
          border-radius: 8px; background: #fff; }
  textarea { min-height: 110px; resize: vertical; }
  button, .btn { font: inherit; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer;
          background: var(--ink); color: #fff; }
  button.primary { background: var(--accent); }
  button.ok { background: var(--ok); } button.bad { background: var(--bad); }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: wait; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > .grow { flex: 1; }
  .files { list-style: none; margin: 0; padding: 0; }
  .files li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .files li:last-child { border: 0; }
  .files .name { flex: 1; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  tr.click { cursor: pointer; } tr.click:hover { background: var(--accent-soft); }
  tr.sel { background: var(--accent-soft); }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: #eeece6; white-space: nowrap; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .msg { padding: 8px 12px; border-radius: 8px; margin: 8px 0; font-size: 14px; }
  .msg.ok { background: var(--ok-soft); color: var(--ok); } .msg.warn { background: var(--warn-soft); color: var(--warn); }
  .msg.bad { background: var(--bad-soft); color: var(--bad); }
  .dialogue { font-style: italic; }
  .spend { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .spend .big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .spend .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .bar { height: 8px; background: #eeece6; border-radius: 99px; overflow: hidden; width: 220px; margin-top: 6px; }
  .bar > span { display: block; height: 100%; background: var(--ok); }
  .bar.hot > span { background: var(--bad); }
  .htmx-request .spin { display: inline; } .spin { display: none; }
  code { background: #eeece6; padding: 1px 6px; border-radius: 4px; font-size: 13px; }
  details summary { cursor: pointer; }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">STUDIO OS<small>KToonStudio · dự án pilot</small></div>
  <nav>
    <a href="/" class="{% if request.url.path == '/' %}on{% endif %}">Kịch bản &amp; Shot list</a>
    <a href="/kho" class="{% if request.url.path == '/kho' %}on{% endif %}">Kho nhân vật &amp; bối cảnh</a>
    <a href="/so-chi" class="{% if request.url.path == '/so-chi' %}on{% endif %}">Sổ chi tiêu</a>
  </nav>
</div></header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
