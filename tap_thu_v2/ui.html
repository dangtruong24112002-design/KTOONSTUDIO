<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KTOON · Tập thử v2</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1d212a;--line:#2a2f3a;--text:#e8e9ec;--muted:#9aa1ad;--accent:#ff7a45;--accent2:#ffb088;--ok:#3ecf8e;--warn:#f5b942;--err:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:#3a4150}
button.primary{background:var(--accent);border-color:var(--accent);color:#1a0d06;font-weight:600}
button.primary:hover{background:var(--accent2)}
button:disabled{opacity:.45;cursor:not-allowed}
button.link{background:none;border:none;color:var(--accent2);padding:0;text-decoration:underline}
input,select,textarea{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:6px 9px;width:100%}
textarea{resize:vertical;line-height:1.45;font-family:inherit}
a{color:var(--accent2)}
.top{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.96);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.brand{font-weight:800;letter-spacing:.04em;font-size:16px}.brand span{font-weight:400;color:var(--muted);letter-spacing:0}
.meters{display:flex;flex-wrap:wrap;gap:8px 22px;margin-left:auto;align-items:center}
.meter .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meter .val{font-weight:700;font-variant-numeric:tabular-nums}.meter small{font-weight:400;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:3px;width:130px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.bar.hot i{background:var(--err)}
.jump{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line);position:sticky;top:49px;z-index:4;background:rgba(15,17,21,.96)}
.jump button{border-radius:999px;padding:4px 11px;font-size:12.5px}
main{padding:16px;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.epwrap{border:1px solid #3a4150;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:14px;background:#12141a}
h1{font-size:19px;margin:0}h2{font-size:17px;margin:0}h3{font-size:15px;margin:0}
.hint,.muted{color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px}
.chip.a{border-color:#2d4a6b;color:#9cc7ff}.chip.b{border-color:#7a3b22;color:#ffb088}
.status{font-size:12px;border-radius:6px;padding:2px 8px;display:inline-block}
.st-running,.st-starting,.st-queued{background:#3a2a17;color:var(--warn)}.st-done{background:#15321f;color:var(--ok)}
.st-failed,.st-stalled{background:#3a1717;color:var(--err)}.st-cancelled{background:var(--card2);color:var(--muted)}
.err{color:var(--err);font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.warnbox{border:1px solid #5a4516;background:#2a2112;color:#f3d38b;border-radius:10px;padding:8px 12px;font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .head{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.tile .head b,.tile .head input{font-size:14px}
.media{width:100%;border-radius:8px;object-fit:cover;display:block;background:#000}
.m34{aspect-ratio:3/4}.m916{aspect-ratio:9/16}.m219{aspect-ratio:21/9}.m169{aspect-ratio:16/9}.m11{aspect-ratio:1/1}
.ph{width:100%;aspect-ratio:16/9;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12.5px;padding:10px}
.takes{display:flex;flex-wrap:wrap;gap:4px}
.take{padding:2px 8px;font-size:12px;border-radius:6px}
.take.on{border-color:var(--accent);color:var(--accent2)}
.take.fail{color:var(--err)}.take.run{color:var(--warn)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
details pre{white-space:pre-wrap;word-break:break-word;background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;max-height:320px;overflow:auto;margin:6px 0 0}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-size:13px}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.big{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.uprow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;border:1px dashed var(--line);border-radius:8px;padding:8px;margin:2px 0}
.uprow input[type=file]{flex:2 1 160px}
.uprow select,.uprow .up-label{flex:1 1 90px;width:auto}
.fld{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:0}
.fld select,.fld input{min-width:0}
.stephead{font-size:12px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.03em;margin-top:4px}
.dirty{position:sticky;top:90px;z-index:3}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow:auto}
.modal ul{margin:0;padding-left:18px;max-height:260px;overflow:auto;font-size:13px}
.toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:30;max-width:420px}
.toast div{background:#23272f;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.toast div.bad{border-color:#6b2b2b;background:#2c1a1a}
.offline{background:#3a1717;color:#ffd0d0;padding:8px 16px;font-size:13px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--warn);border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}
.qcgrid{display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:8px;align-items:center}
.chatbox{border:1px solid var(--line);border-radius:10px;padding:8px}
.chatlog{max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:6px 0}
.chatmsg{font-size:12.5px;border-radius:8px;padding:5px 8px;background:var(--card2)}
.chatmsg.me{background:#1d2a3a}.chatmsg.crit{background:#2a2112;color:#f3d38b}
.badge-unapproved{border-color:#7a3b22;color:#ffb088}
.batchrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
@media (max-width:760px){.meters{margin-left:0}.qcgrid{grid-template-columns:1fr}.batchrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="offline" class="offline" hidden>Mất kết nối với app. Cửa sổ đen (app) còn mở không? Mở lại app rồi tải lại trang này.</div>
<header class="top">
  <div class="brand">KTOON <span>· tập thử v2</span></div>
  <div class="meters" id="meters"></div>
</header>
<div class="jump" id="jump"></div>
<main id="main"></main>
<div id="modal" class="modal" hidden><div class="box"><h3 id="mTitle"></h3><div id="mBody"></div>
  <div class="row" style="justify-content:flex-end"><button id="mCancel">Huỷ</button><button id="mOk" class="primary">Chạy</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const TOKEN = "__TAPTHU_TOKEN__";
let S = null;
const dirty = {}; // section-id -> true while owner is editing/typing in it, or a live media is playing in it
const OPEN_CHATS = new Set();
document.addEventListener("toggle", e => {
  if (e.target.matches && e.target.matches("details.chatbox")) {
    const key = e.target.dataset.chatkey;
    if (e.target.open) OPEN_CHATS.add(key); else OPEN_CHATS.delete(key);
  }
}, true);

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = (x, d) => "$" + (Number(x) || 0).toFixed(d == null ? ((Number(x) || 0) < 1 ? 3 : 2) : d);
const trieu = x => ((Number(x) || 0) / 1e6).toLocaleString("vi-VN", {maximumFractionDigits: 1}) + " triệu đ";
const ACTIVE = ["queued", "starting", "running"];
const ST_VI = {queued:"chờ", starting:"bắt đầu", running:"đang chạy", done:"xong", failed:"lỗi", stalled:"quá giờ", cancelled:"đã huỷ"};

async function api(path, body) {
  const opt = {headers: {"X-Tapthu-Token": TOKEN}};
  if (body !== undefined) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (r.status === 403) {
    fatal = true;
    $("#offline").hidden = false;
    $("#offline").textContent = "Có bản mới hoặc app vừa mở lại — bấm F5 (tự tải lại nếu không đang gõ dở).";
    if (Object.keys(dirty).length === 0) setTimeout(() => location.reload(), 2000);
    throw new Error("token");
  }
  return r.json();
}
let fatal = false;
async function upload(kind, params, file) {
  const ext = "." + (file.name.split(".").pop() || "bin").toLowerCase();
  const q = new URLSearchParams(Object.assign({kind, ext}, params));
  const r = await fetch("/api/upload?" + q.toString(), {method: "POST", headers: {"X-Tapthu-Token": TOKEN}, body: file});
  return r.json();
}
async function uploadText(purpose, file) {
  const q = new URLSearchParams({purpose, filename: file.name});
  const r = await fetch("/api/upload_text?" + q.toString(), {method: "POST", headers: {"X-Tapthu-Token": TOKEN}, body: file});
  return r.json();
}
function toast(msg, bad) {
  const d = document.createElement("div"); d.textContent = msg; if (bad) d.className = "bad";
  $("#toast").appendChild(d); setTimeout(() => d.remove(), bad ? 9000 : 4000);
}
function ask(title, html, okLabel) {
  return new Promise(res => {
    $("#mTitle").textContent = title; $("#mBody").innerHTML = html; $("#mOk").textContent = okLabel || "Chạy";
    $("#modal").hidden = false;
    const done = v => { $("#modal").hidden = true; $("#mOk").onclick = $("#mCancel").onclick = null; res(v); };
    $("#mOk").onclick = () => done(true); $("#mCancel").onclick = () => done(false);
  });
}

// ---------- data helpers
const jobs = (kind, target) => S.jobs.filter(j => j.kind === kind && (target == null || j.target === target));
const jobById = id => S.jobs.find(j => j.id === id);
const pickOf = (kind, target) => jobById(S.picks[kind + ":" + target]);
const src = j => j ? (j.file ? "/files/" + j.file.split("/").map(encodeURIComponent).join("/") : j.url) : "";
const active = () => S.jobs.some(j => ACTIVE.includes(j.status));
const charName = id => (S.chars[id] || {name: id}).name;
function statusTag(j) {
  if (!j) return "";
  const spin = ACTIVE.includes(j.status) ? '<span class="spin"></span>' : "";
  return `<span class="status st-${j.status}">${spin}${ST_VI[j.status] || j.status}</span>`;
}
function takesRow(kind, target) {
  const ts = jobs(kind, target), p = pickOf(kind, target);
  if (!ts.length) return "";
  return '<div class="takes">' + ts.map(j => {
    const cls = j.status === "done" ? (p && p.id === j.id ? "on" : "") : (["failed", "stalled"].includes(j.status) ? "fail" : (ACTIVE.includes(j.status) ? "run" : ""));
    const tip = j.status === "done" ? "Chọn bản này" : (j.error || ST_VI[j.status] || j.status);
    const tlabel = j.provider === "local" ? "tải lên" : "t" + j.take;
    return `<button class="take ${cls}" data-act="pick" data-job="${esc(j.id)}" title="${esc(tip)}">${tlabel}${j.status === "done" ? "" : " · " + (ST_VI[j.status] || j.status)}</button>`;
  }).join("") + "</div>";
}
function itemBtn(stage, target, label, redo) {
  return `<button data-act="run" data-stage="${stage}" data-target="${esc(target)}" ${redo ? 'data-redo="1"' : ""}>${esc(label)}</button>`;
}
function bulkBtn(stage, label, cls) {
  return `<button class="${cls || ""}" data-act="run" data-stage="${stage}">${esc(label)}</button>`;
}
function uploadRow(kind, id, opts) {
  opts = opts || {};
  const extra = kind === "component"
    ? `<label class="fld" style="flex:1 1 80px">Nguồn ảnh<select class="up-source"><option value="ai">AI</option><option value="real">người thật</option></select></label>
       <label class="fld" style="flex:1 1 80px">Dùng cho phần<select class="up-use">${(S.component_uses || []).map(u => `<option>${u}</option>`).join("")}</select></label>
       <label class="fld" style="flex:1 1 100px">Nhãn (ghi chú)<input class="up-label" placeholder="vd: hair, eyes"></label>`
    : `<label class="fld" style="flex:1 1 100px">Nhãn (tuỳ chọn)<input class="up-label" placeholder="để trống cũng được"></label>`;
  return `<div class="uprow" data-kind="${kind}" data-id="${esc(id)}">
    <label class="fld" style="flex:2 1 160px">Chọn file ảnh trên máy<input type="file" class="up-file"></label>${extra}
    <button data-act="do-upload">${esc(opts.label || "Tải lên")}</button></div>`;
}
function approveBadge(bank, item) {
  if (item.approved) return "";
  return ` <span class="chip badge-unapproved">chưa duyệt</span> <button data-act="approve" data-bank="${bank}" data-id="${item.id}">Duyệt</button>`;
}
function chatPanel(kind, id) {
  const key = kind + ":" + id;
  const hist = (S.chats[key] || []).map(t => {
    const cls = t.role === "user" ? "me" : (t.role === "critique" ? "crit" : "bot");
    const who = t.role === "user" ? "Bạn" : (t.role === "critique" ? "Nhận xét" : "Lệnh đã gửi (English)");
    return `<div class="chatmsg ${cls}"><b>${who}:</b> ${esc(t.text)}</div>`;
  }).join("");
  const canCritique = S.llm_vision_ok !== false && !!pickOf(kind, id);
  return `<details class="chatbox" data-chatkey="${esc(key)}" ${OPEN_CHATS.has(key) ? "open" : ""}><summary>Chat sửa ảnh (${(S.chats[key] || []).filter(t => t.role === "user").length} lần)</summary>
    <div class="chatlog">${hist || '<div class="muted">Chưa sửa lần nào.</div>'}</div>
    <textarea class="chat-text" rows="2" placeholder="Yêu cầu sửa (tiếng Việt hoặc tiếng Anh)…"></textarea>
    <div class="row">
      <select class="chat-model">${((S.model_catalog && S.model_catalog.image) || []).map(m => `<option value="${esc(m.id)}">${esc(imgOptLabel(m))}</option>`).join("")}</select>
      <select class="chat-res"><option value="2k">2K</option><option value="4k">4K</option></select>
    </div>
    <div class="row"><input type="file" class="chat-file" style="flex:2 1 140px">
      <select class="chat-source" style="flex:1 1 70px"><option value="ai">ai</option><option value="real">real</option></select>
      <select class="chat-use" style="flex:1 1 80px">${(S.component_uses || []).map(u => `<option>${u}</option>`).join("")}</select></div>
    <div class="row"><button class="primary" data-act="chat-send" data-kind="${kind}" data-id="${id}">Gửi</button>
      ${canCritique ? `<button data-act="chat-critique" data-kind="${kind}" data-id="${id}">Nhận xét ảnh</button>` : ""}</div>
  </details>`;
}

// ---------- header + quick jump
function renderHeader() {
  const m = S.money, b = S.budget, pct = Math.min(100, (m.spent + m.reserved) / b * 100);
  const runN = S.jobs.filter(j => ACTIVE.includes(j.status)).length;
  const keys = ["wavespeed", "atlas"].map(p => `${p === "atlas" ? "Atlas" : "WaveSpeed"}: ${S.keys[p] ? "có key" : "chưa có key"}`).join(" · ");
  const ver = (S.update && S.update.version) || {};
  const verStr = ver.sha ? `Phiên bản: ${esc(ver.sha.slice(0, 7))} · ${esc((ver.t || "").replace("T", " ").slice(0, 16))}` : "Phiên bản: chưa rõ";
  $("#meters").innerHTML =
    `<div class="meter"><div class="lbl">Đã chi</div><div class="val">${usd(m.spent, 2)} <small>/ trần ${usd(b, 2)}</small></div><div class="bar ${pct > 85 ? "hot" : ""}"><i style="width:${pct}%"></i></div></div>` +
    `<div class="meter"><div class="lbl">Đang chạy</div><div class="val">${runN ? '<span class="spin"></span>' : ""}${runN} việc</div></div>` +
    `<div class="meter"><span class="muted">${esc(keys)}</span></div>` +
    `<div class="meter"><span class="muted">${esc(verStr)}</span></div>` +
    `<button data-act="reload-keys">Đọc lại keys.txt</button>`;
  const jumps = [["#sec-script", "Kịch bản"], ["#sec-list", "Danh sách"], ["#sec-templates", "Prompt mẫu"], ["#sec-reflib", "Kho ref"],
                 ["#sec-chars", "Nhân vật"], ["#sec-envs", "Bối cảnh"], ["#sec-props", "Prop"], ["#sec-settings", "Cài đặt"]]
    .concat((S.episodes_order || []).map(eid => ["#ep-" + eid, eid])).concat([["#sec-cost", "Chi phí"]]);
  $("#jump").innerHTML = jumps.map(([href, label]) => `<button data-jump="${href}">${esc(label)}</button>`).join("");
}

// ---------- section persistence engine: each logical block keeps its own DOM node so that
// typing/playing media in one block never disturbs another block's live status elsewhere on the page.
function ensureSec(parent, id) {
  let el = document.getElementById("sec-" + id);
  if (!el) { el = document.createElement("div"); el.id = "sec-" + id; el.className = "sec"; parent.appendChild(el); }
  else if (el.parentNode !== parent) { parent.appendChild(el); } // keep episodes_order position stable
  return el;
}
const NON_TEXT_INPUT_TYPES = ["file", "checkbox", "radio", "button", "submit", "reset", "range", "image", "color"];
function isEditableField(a) {
  if (!a) return false;
  if (a.tagName === "TEXTAREA" || a.tagName === "SELECT") return true;
  if (a.tagName === "INPUT") return !NON_TEXT_INPUT_TYPES.includes((a.type || "text").toLowerCase());
  return false;
}
function isProtected(el) {
  const a = document.activeElement;
  if (a && el.contains(a) && isEditableField(a)) return true;
  if ([...el.querySelectorAll("video,audio")].some(m => !m.paused && !m.ended)) return true;
  return false;
}
function dirtyBarHtml(id) { return `<div class="warnbox dirty row between"><span>Có thay đổi/đang gõ trong phần này — tạm không tự làm mới.</span><button data-act="discard-sec" data-sec="${esc(id)}">Làm mới phần này</button></div>`; }
function updateSec(parent, id, sigVal, htmlFn, force) {
  const el = ensureSec(parent, id);
  if (!force && (dirty[id] || isProtected(el))) {
    if (!el.querySelector(".dirty") && dirty[id]) el.insertAdjacentHTML("afterbegin", dirtyBarHtml(id));
    return;
  }
  const sig = JSON.stringify(sigVal);
  if (!force && el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  el.innerHTML = htmlFn();
}

// ---------- section builders
function secProject(force) {
  updateSec($("#main"), "project", [S.project], () => `<section class="card" id="sec-project-inner"><h2>Dự án</h2>
    <div class="row"><label style="flex:2 1 240px">Tên dự án<input id="pname" value="${esc(S.project.name)}"></label>
    <button class="primary" data-act="save-project">Lưu dự án</button></div>
    <p class="hint">Mọi file (ảnh, video, xuất) sẽ nằm trong thư mục projects/${esc(S.project.name)}/ trên máy.</p></section>`, force);
}
function secScript(force) {
  const st = S.todo.split_episodes || {};
  const js = jobs("split_episodes"), last = js[js.length - 1];
  updateSec($("#main"), "script", [S.script_raw, S.episodes_order, last && last.id + last.status, st.error], () => {
    let status = "";
    if (last && ACTIVE.includes(last.status)) status = `<div class="warnbox"><span class="spin"></span>GPT đang tách kịch bản thành các tập…</div>`;
    else if (last && last.status === "failed") status = `<div class="err">${esc(last.error)}</div>`;
    return `<section class="card"><h1>1. Kịch bản + Shot list</h1>

          <option value="low" ${st.llm_write_thinking === "low" ? "selected" : ""}>Thấp</option>
          <option value="medium" ${st.llm_write_thinking === "medium" ? "selected" : ""}>Vừa</option>

      <div class="row"><select data-act="save-setting" data-key="gpt_image2_quality">
        <option value="low" ${st.gpt_image2_quality === "low" ? "selected" : ""}>Thấp</option>
        <option value="medium" ${st.gpt_image2_quality === "medium" ? "selected" : ""}>Vừa</option>
        <option value="high" ${st.gpt_image2_quality === "high" ? "selected" : ""}>Cao</option></select></div>
      ${gpt2 && gpt2.note ? `<div class="warnbox">${esc(gpt2.note)}</div>` : ""}
      <details><summary>Sửa giá model bằng tay (JSON, nâng cao — dùng khi nhà cung cấp đổi giá)</summary>
        <p class="hint">Mỗi model 1 dòng, vd <code>"anthropic/claude-opus-5.5": {"price_in": 4.0, "price_out": 20.0}</code> (LLM) hoặc
        <code>"google/nano-banana-pro/edit": {"price": {"2k": 0.14, "4k": 0.24}}</code> (ảnh). Chỉ cần ghi model muốn sửa giá, model khác giữ giá mặc định.</p>
        <textarea id="modelPricesJson" rows="8">${esc(JSON.stringify(st.model_prices || {}, null, 1))}</textarea>
        <div class="row"><button data-act="save-model-prices">Lưu giá model</button></div></details></section>`;
  }, force);
}
function secCost(force) {
  updateSec($("#main"), "cost", [S.cost, S.by_stage, S.balance, S.jobs.filter(j => j.measured).map(j => j.id)], () => {
    const c = S.cost;
    const order = ["split_episodes","parse_list","preprod","reflib_scan","suggest_components","portrait","sheet","env_wide","env_rev","prop","storyboard","prompt","review","gen","fix_img","patch","critique"];
    const rows = order.filter(k => S.by_stage[k]).map(k => { const b = S.by_stage[k];
      return `<tr><td>${esc(S.stage_names[k] || k)}</td><td class="num">${b.done}</td><td class="num">${b.failed}</td><td class="num">${b.active}</td><td class="num">${usd(b.spent, 3)}</td></tr>`; }).join("");
    const bal = ["wavespeed", "atlas"].map(p => { const b = S.balance[p] || {}; const name = p === "atlas" ? "Atlas Cloud" : "WaveSpeed";
      return `<tr><td>${name}${S.keys[p] ? "" : ' <span class="muted">(chưa có key)</span>'}</td><td class="num">${b.start != null ? usd(b.start, 2) : "—"}</td><td class="num">${b.now != null ? usd(b.now, 2) : "—"}</td><td class="num">${b.start != null && b.now != null ? usd(b.start - b.now, 3) : "—"}</td></tr>`; }).join("");
    const measured = S.jobs.filter(j => j.measured);
    return `<section class="card"><h1>13. Chi phí</h1><div class="kpis">
        <div class="kpi"><div class="muted">Đã chi</div><div class="big">${usd(c.spent, 2)}</div></div>
        <div class="kpi"><div class="muted">Thực chi (số dư giảm)</div><div class="big">${c.real != null ? usd(c.real, 2) : "—"}</div></div>
        <div class="kpi"><div class="muted">×60 tập, quy VND</div><div class="big">${trieu(c.projection_vnd)}</div><div class="muted">mục tiêu ≤ 30 triệu, hợp đồng 50 triệu</div></div>
        <div class="kpi"><div class="muted">Trần chi lần thử này</div><div class="big">${usd(c.cap_usd, 2)}</div></div></div>
      <div class="kpis">
        <div class="kpi"><div class="muted">Làm 1 lần cho cả series (nhân vật/bối cảnh/prop/đọc danh sách)</div><div class="big">${usd(c.series_spent, 3)}</div></div>
        <div class="kpi"><div class="muted">Lặp lại mỗi tập (shot/prompt/storyboard/video)</div><div class="big">${usd(c.episode_spent, 3)}</div></div>
      </div></section>
      <section class="card"><h3>Theo bước</h3><div class="tablewrap"><table><tr><th>Bước</th><th class="num">Xong</th><th class="num">Lỗi/huỷ</th><th class="num">Đang chạy</th><th class="num">Chi USD</th></tr>${rows || '<tr><td colspan="5" class="muted">Chưa chi gì.</td></tr>'}</table></div>
        <p class="hint">Chi tiết từng lần gọi: <a href="/files/output/so_chi.csv" target="_blank">so_chi.csv</a> · nhật ký: <a href="/files/output/nhat_ky.txt" target="_blank">nhat_ky.txt</a></p></section>
      <section class="card"><div class="row between"><h3>Số dư tài khoản</h3><div class="row"><button data-act="balance">Cập nhật số dư</button><button data-act="balance-reset">Đặt lại mốc</button></div></div>
        <div class="tablewrap"><table><tr><th>Nhà cung cấp</th><th class="num">Lúc bắt đầu</th><th class="num">Hiện tại</th><th class="num">Đã giảm</th></tr>${bal}</table></div></section>
      ${measured.length ? `<section class="card"><h3>Giá đo thật</h3><div class="tablewrap"><table><tr><th>Việc</th><th>Model</th><th class="num">Giây</th><th class="num">Niêm yết/s</th><th class="num">Đo được/s</th></tr>${measured.map(j => `<tr><td>${esc(j.id)}</td><td>${esc(j.model)}</td><td class="num">${j.units}</td><td class="num">${usd(j.unit_price, 4)}</td><td class="num">${j.measured.per_unit != null ? usd(j.measured.per_unit, 4) : "—"}</td></tr>`).join("")}</table></div></section>` : ""}`;
  }, force);
}

function renderAll(force) {
  if (!S) return;
  renderHeader();
  secProject(force); secScript(force); secList(force); secTemplates(force); secReflib(force);
  secChars(force); secEnvs(force); secProps(force); secVoices(force); secRefs(force);
  secSettings(force);
  secEpisodesAll(force);
  secCost(force);
}

let redirecting = false;
async function refresh(force) {
  if (fatal) return;
  try { S = await api("/api/state"); $("#offline").hidden = true; }
  catch (e) { if (!fatal) $("#offline").hidden = false; return; }
  const applied = S.update && S.update.state && S.update.state.applied;
  if (applied && applied.new_port && !redirecting) {
    if (Object.keys(dirty).length === 0) {
      redirecting = true;
      toast("Đã có bản mới — đang chuyển sang…");
      setTimeout(() => { location.href = "http://127.0.0.1:" + applied.new_port + "/"; }, 1500);
    } else {
      $("#offline").hidden = false;
      $("#offline").textContent = "Đã có bản mới (cổng " + applied.new_port + ") — lưu xong rồi bấm F5, hoặc vào http://127.0.0.1:" + applied.new_port + "/";
    }
  }
  renderAll(force);
}
async function loop() { await refresh(); setTimeout(loop, S && active() ? 1500 : 4000); }

// ---------- actions
async function runStage(stage, target, redo) {
  const dry = await api("/api/run", {stage, target: target || null, redo: !!redo, dry: true});
  if (dry.error) return toast(dry.error, true);
  if (!dry.n) return toast("Không có việc nào cần làm.");
  const ok = await ask(`Chạy ${dry.n} việc · ước tính ~${usd(dry.est)}`,
    `<ul>${dry.items.map(x => `<li>${esc(x)}</li>`).join("")}</ul><p class="muted">Đã chi ~${usd(S.money.spent, 2)} · trần ${usd(S.budget, 2)}. Tiền thật sẽ bị trừ khi gửi.</p>`, "Chạy");
  if (!ok) return;
  const r = await api("/api/run", {stage, target: target || null, redo: !!redo});
  if (r.error) return toast(r.error, true);
  toast(`Đã xếp hàng ${r.n} việc (~${usd(r.est)})`);
  await refresh();
}
document.addEventListener("click", async e => {
  const jb = e.target.closest("[data-jump]");
  if (jb) { const el = document.querySelector(jb.dataset.jump); if (el) el.scrollIntoView({behavior: "smooth", block: "start"}); return; }
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  const d = t.dataset;
  try {
    switch (d.act) {
      case "run": await runStage(d.stage, d.target, d.redo === "1"); break;
      case "pick": { const j = jobById(d.job); if (!j || j.status !== "done") { if (j && j.error) toast(j.error, j.status !== "cancelled"); break; } const r = await api("/api/pick", {job: d.job}); if (r.error) toast(r.error, true); await refresh(); break; }
      case "reload-keys": { const r = await api("/api/reload_keys", {}); toast(`WaveSpeed: ${r.keys.wavespeed ? "có key" : "chưa có"} · Atlas: ${r.keys.atlas ? "có key" : "chưa có"} · trần ${usd(r.budget, 2)}`); setTimeout(() => refresh(), 1500); break; }
      case "balance": case "balance-reset": { await api("/api/balance", {reset_start: d.act === "balance-reset"}); toast("Đã cập nhật số dư"); await refresh(); break; }
      case "discard-sec": { delete dirty[d.sec]; const el = document.getElementById("sec-" + d.sec); if (el) delete el.dataset.sig; if (document.activeElement) document.activeElement.blur(); await refresh(); break; }
      case "save-project": { const r = await api("/api/project", {name: $("#pname").value}); delete dirty.project; if (r.error) toast(r.error, true); else toast("Đã lưu"); await refresh(); break; }
      case "upload-script": { const f = $("#scriptFile").files[0]; if (!f) { toast("Chọn file trước", true); break; } const r = await uploadText("script", f); if (r.error) toast(r.error, true); else toast("Đã đọc file, nối vào ô kịch bản"); await refresh(); break; }
      case "upload-list": { const f = $("#listFile").files[0]; if (!f) { toast("Chọn file trước", true); break; } const r = await uploadText("list", f); if (r.error) toast(r.error, true); else toast("Đã đọc file, nối vào ô danh sách"); await refresh(); break; }
      case "save-script-raw": { const r = await api("/api/script_raw", {text: $("#scriptRaw").value}); delete dirty.script; if (r.error) toast(r.error, true); else toast("Đã lưu"); await refresh(); break; }
      case "save-list-raw": { const r = await api("/api/list_raw", {text: $("#listRaw").value}); delete dirty.list; if (r.error) toast(r.error, true); else toast("Đã lưu"); await refresh(); break; }
      case "save-style": { const r = await api("/api/style", {text: $("#styleText").value}); delete dirty.list; if (r.error) toast(r.error, true); else toast("Đã lưu style"); await refresh(); break; }
      case "save-template": { const ta = document.querySelector(`textarea[data-tpl="${d.key}"]`); const r = await api("/api/template", {key: d.key, text: ta.value}); delete dirty.templates; if (r.error) toast(r.error, true); else toast("Đã lưu mẫu"); await refresh(); break; }
      case "save-reflib": { const r = await api("/api/reflib/path", {path: $("#reflibPath").value}); delete dirty.reflib; if (r.error) toast(r.error, true); else toast("Đã lưu đường dẫn kho ref"); await refresh(); break; }
      case "new-char": { const name = $("#newCharName").value.trim(); if (!name) break; await api("/api/char/new", {name}); await refresh(); break; }
      case "new-env": { const name = $("#newEnvName").value.trim(); if (!name) break; await api("/api/env/new", {name}); await refresh(); break; }
      case "new-prop": { const name = $("#newPropName").value.trim(); if (!name) break; await api("/api/prop/new", {name}); await refresh(); break; }
      case "new-voice": { const name = $("#newVoiceName").value.trim(); if (!name) break; await api("/api/voice/new", {name, char: $("#newVoiceChar").value}); await refresh(); break; }
      case "new-ref": { const name = $("#newRefName").value.trim(); if (!name) break; await api("/api/videoref/new", {name}); await refresh(); break; }
      case "new-episode": { const name = $("#newEpName").value.trim(); await api("/api/episode/new", {name}); $("#newEpName").value = ""; await refresh(); break; }
      case "rm-comp": { await api("/api/component/remove", {char: d.char, comp: d.comp}); await refresh(); break; }
      case "do-upload": { const row = t.closest(".uprow"); const file = row.querySelector(".up-file").files[0]; if (!file) { toast("Chọn file trước", true); break; }
        const label = (row.querySelector(".up-label") || {}).value || "";
        const params = row.dataset.kind === "component" ? {char: row.dataset.id, label, source: row.querySelector(".up-source").value, use: row.querySelector(".up-use").value} : {target: row.dataset.id, label};
        const r = await upload(row.dataset.kind, params, file); if (r.error) toast(r.error, true); else toast("Đã tải lên"); await refresh(); break; }
      case "save-prompt": { const ta = document.querySelector(`textarea[data-act="prompt-text"][data-id="${d.id}"]`); const r = await api("/api/prompt", {batch: d.id, text: ta.value}); if (r.error) toast(r.error, true); else toast("Đã lưu prompt"); await refresh(); break; }
      case "save-fix-prompt": { const ta = document.querySelector(`textarea[data-act="fix-prompt"][data-id="${d.id}"]`); const r = await api("/api/fix/prompt", {id: d.id, text: ta.value}); if (r.error) toast(r.error, true); else toast("Đã lưu"); await refresh(); break; }
      case "new-fix": { const eid = d.ep; const batch = $("#fixBatch-" + eid).value, start = Number($("#fixStart-" + eid).value) || 0, end = Number($("#fixEnd-" + eid).value) || (start + 4);
        const r = await api("/api/fix/new", {batch, start, end}); if (r.error) toast(r.error, true); else toast("Đã cắt khung hình"); await refresh(); break; }
      case "export": { const r = await api("/api/export", {ep: d.ep}); if (r.error) toast(r.error, true); await refresh(); break; }
      case "qc-result": { const bid = d.id; const ep = Object.values(S.episodes).find(e => e.qc && bid in e.qc || e.batches.some(b => b.id === bid)); const cur = ((ep.qc || {})[bid] || {}).result; const r = await api("/api/qc", {batch: bid, result: cur === d.v ? null : d.v}); if (r.error) toast(r.error, true); await refresh(); break; }
      case "save-shots-json": { let shots; try { shots = JSON.parse($("#shotsJson-" + d.ep).value); } catch (err) { toast("JSON lỗi: " + err.message, true); break; }
        const r = await api("/api/episode/shots", {ep: d.ep, shots}); delete dirty["epshots-" + d.ep]; if (r.error) toast(r.error, true); else toast("Đã lưu shot list"); await refresh(); break; }
      case "split-batches": { const r = await api("/api/episode/batches/split", {ep: d.ep}); if (r.error) toast(r.error, true); else toast("Đã chia batch"); await refresh(); break; }
      case "save-batches-json": { let batches; try { batches = JSON.parse($("#batchesJson-" + d.ep).value); } catch (err) { toast("JSON lỗi: " + err.message, true); break; }
        const r = await api("/api/episode/batches/save", {ep: d.ep, batches}); delete dirty["epbatches-" + d.ep]; if (r.error) toast(r.error, true); else toast("Đã lưu batch"); await refresh(); break; }
      case "approve": { const r = await api("/api/approve", {bank: d.bank, id: d.id, approved: true}); if (r.error) toast(r.error, true); await refresh(); break; }
      case "chat-send": { const box = t.closest("details.chatbox"); const text = box.querySelector(".chat-text").value;
        if (!text.trim()) { toast("Chưa gõ yêu cầu sửa", true); break; }
        const model = box.querySelector(".chat-model").value, resolution = box.querySelector(".chat-res").value;
        const file = box.querySelector(".chat-file").files[0];
        let attachments = [];
        if (file) {
          const ru = await upload("chat_attach", {label: "attach", source: box.querySelector(".chat-source").value, use: box.querySelector(".chat-use").value}, file);
          if (ru.error) { toast(ru.error, true); break; }
          attachments = [ru.job];
        }
        const dry = await api("/api/chat", {kind: d.kind, target: d.id, text, model, resolution, dry: true});
        if (dry.error) { toast(dry.error, true); break; }
        const ok = await ask(`Sửa ảnh · ước tính ~${usd(dry.est)}`, `<p class="muted">${esc(dry.items[0])}</p>`, "Gửi");
        if (!ok) break;
        const r = await api("/api/chat", {kind: d.kind, target: d.id, text, model, resolution, attachments});
        if (r.error) toast(r.error, true); else { toast("Đã gửi yêu cầu sửa"); box.querySelector(".chat-text").value = ""; }
        await refresh(); break; }
      case "chat-critique": { const target = d.kind + ":" + d.id;
        const dry = await api("/api/run", {stage: "critique", target, dry: true});
        if (dry.error) { toast(dry.error, true); break; }
        const ok = await ask(`Nhận xét ảnh · ước tính ~${usd(dry.est)}`, "<p class=\"muted\">Không tốn tiền sửa ảnh, chỉ tốn tiền LLM xem ảnh.</p>", "Xem");
        if (!ok) break;
        const r = await api("/api/run", {stage: "critique", target});
        if (r.error) toast(r.error, true); await refresh(); break; }
      case "storyboard-toggle": { const sh = Object.values(S.episodes).flatMap(e => e.shots).find(x => x.id === d.id);
        const r = await api("/api/shot/storyboard", {id: d.id, on: !sh.storyboard_on});
        if (r.error) toast(r.error, true); await refresh(); break; }
      case "save-model-prices": { let mp; try { mp = JSON.parse($("#modelPricesJson").value); } catch (err) { toast("JSON lỗi: " + err.message, true); break; }
        const r = await api("/api/settings", {settings: {model_prices: mp}}); delete dirty.settings;
        if (r.error) toast(r.error, true); else toast("Đã lưu giá model"); await refresh(); break; }
      case "save-keys": {
        const body = d.datadir ? {data_dir: $("#dataDirInput").value}
          : d.github ? {github_token: $("#githubToken").value, github_repo: $("#githubRepo").value}
          : {wavespeed: $("#keyWavespeed").value, atlas: $("#keyAtlas").value};
        if (!d.datadir && !d.github && !body.wavespeed && !body.atlas) { toast("Chưa dán key nào", true); break; }
        if (d.datadir && !body.data_dir.trim()) { toast("Chưa nhập đường dẫn", true); break; }
        if (d.github && !body.github_token.trim() && !body.github_repo.trim()) { toast("Chưa nhập gì", true); break; }
        const r = await api("/api/keys/save", body);
        delete dirty.settings;
        if ($("#keyWavespeed")) $("#keyWavespeed").value = "";
        if ($("#keyAtlas")) $("#keyAtlas").value = "";
        if ($("#githubToken")) $("#githubToken").value = "";
        if (r.error) toast(r.error, true); else toast(r.note || "Đã lưu");
        await refresh(); break; }
      case "check-update": {
        const r = await api("/api/update/check_now", {});
        if (r.error) toast(r.error, true); else toast("Đang kiểm tra cập nhật…");
        break; }
    }
  } catch (err) { if (err.message !== "token") toast("Lỗi: " + err.message, true); }
});
document.addEventListener("change", async e => {
  const el = e.target, d = el.dataset;
  try {
    if (d.act === "char-name") await api("/api/char/desc", {id: d.id, name: el.value});
    else if (d.act === "char-desc") await api("/api/char/desc", {id: d.id, text: el.value});
    else if (d.act === "env-text") await api("/api/env/text", {id: d.id, text: el.value});
    else if (d.act === "env-tag") await api("/api/env/text", {id: d.id, tag: el.value});
    else if (d.act === "env-time") await api("/api/env/text", {id: d.id, time: el.value});
    else if (d.act === "batch-model") {
      const eid = d.ep, ep = S.episodes[eid];
      const price = el.value.includes("2.5") ? 0.134 : 0.09;
      const batches = ep.batches.map(b => b.id === d.id ? Object.assign({}, b, {model: el.value, price}) : b);
      await api("/api/episode/batches/save", {ep: eid, batches});
    }
    else if (d.act === "approve-prompt") await api("/api/prompt", {batch: d.id, approved: el.checked});
    else if (d.act === "qc") await api("/api/qc", {batch: d.id, [d.f]: el.checked});
    else if (d.act === "qc-note") await api("/api/qc", {batch: d.id, note: el.value});
    else if (d.act === "save-setting") await api("/api/settings", {settings: {[d.key]: el.value}});
    else return;
    await refresh();
  } catch (err) { toast("Lỗi: " + err.message, true); }
});
document.addEventListener("focusin", e => { if (!isEditableField(e.target)) return; const sec = e.target.closest(".sec"); if (sec && sec.id) dirty[sec.id.replace(/^sec-/, "")] = true; });
document.addEventListener("focusout", e => {
  if (!isEditableField(e.target)) return;
  setTimeout(() => {
    const a = document.activeElement;
    const sec = e.target.closest(".sec");
    if (!sec || !sec.id) return;
    const id = sec.id.replace(/^sec-/, "");
    if (!(a && sec.contains(a) && isEditableField(a))) delete dirty[id];
  }, 0);
});
window.addEventListener("beforeunload", e => { if (Object.keys(dirty).length) { e.preventDefault(); e.returnValue = ""; } });
loop();
