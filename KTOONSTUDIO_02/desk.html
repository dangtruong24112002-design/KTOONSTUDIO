<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/app-icon.png">
<script>try{var t=localStorage.getItem("kd_theme");if(t==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<style>html,body{margin:0}body{font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>/* KTOONSTUDIO Desk — lớp nối với server app (thay cho runtime của claude.ai) */
window.TOKEN="__TOKEN__";
(function(){
const H={"X-Token":window.TOKEN};
const cache={};let rev=-1,inflight=0,ready=null;const subs=[];
function stale(){const b=document.getElementById("deskStale");if(b)b.hidden=false}
async function jget(p){let r;try{r=await fetch(p,{headers:H})}catch(e){throw Object.assign(new Error("Cannot reach the KTOONSTUDIO server."),{code:"unavailable"})}
  if(r.status===401||r.status===403){stale();throw Object.assign(new Error("Session expired — press F5."),{code:"session_expired"})}return r.json()}
async function jpost(p,b,raw){const o={method:"POST",headers:Object.assign({},H)};if(raw){o.body=b;o.headers["X-Filename"]=encodeURIComponent(raw)}else{o.body=JSON.stringify(b);o.headers["Content-Type"]="application/json"}
  let r;try{r=await fetch(p,o)}catch(e){throw Object.assign(new Error("Cannot reach the KTOONSTUDIO server."),{code:"unavailable"})}
  if(r.status===401||r.status===403){stale();throw Object.assign(new Error("Session expired — press F5."),{code:"session_expired"})}return r.json()}
const cl=o=>o==null?o:JSON.parse(JSON.stringify(o));
function mk(id,d){return{id,exists:true,data:()=>cl(d),metadata:{fromCache:false,hasPendingWrites:false}}}
function snapFor(s){const m=cache[s.coll]||{};const cur=new Map(Object.keys(m).map(id=>[id,JSON.stringify(m[id])]));const ch=[];
  cur.forEach((v,id)=>{if(!s.last.has(id))ch.push({type:"added",doc:mk(id,m[id])});else if(s.last.get(id)!==v)ch.push({type:"modified",doc:mk(id,m[id])})});
  s.last.forEach((v,id)=>{if(!cur.has(id))ch.push({type:"removed",doc:mk(id,JSON.parse(v))})});
  if(s.fired&&!ch.length)return null;s.last=cur;s.fired=true;const docs=Object.keys(m).map(id=>mk(id,m[id]));
  return{docs,size:docs.length,empty:!docs.length,docChanges:()=>ch,metadata:{fromCache:false,hasPendingWrites:false}}}
function emit(c){subs.filter(s=>s.coll===c).forEach(s=>{const sn=snapFor(s);if(sn)try{s.next(sn)}catch(e){console.error(e)}})}
async function loadAll(){const j=await jget("/api/desk/all");Object.keys(cache).forEach(k=>delete cache[k]);Object.assign(cache,j.colls||{});rev=j.rev;[...new Set(subs.map(s=>s.coll))].forEach(emit)}
let chain=Promise.resolve();
function write(c,id,d){if(d==null){if(cache[c])delete cache[c][id]}else(cache[c]=cache[c]||{})[id]=cl(d);emit(c);inflight++;const body={coll:c,id,doc:d==null?null:cl(d)};
  const p=chain.then(()=>put1(body));chain=p.catch(()=>{});return p}
async function put1(body){
  try{const j=await jpost("/api/desk/put",body);if(j.error)throw new Error(j.error);const exp=rev+1;rev=Math.max(rev,j.rev);if(j.rev!==exp)setTimeout(()=>{if(!inflight)loadAll().catch(()=>{})},50)}finally{inflight--}}
let uidN=0;const uidx=()=>Date.now().toString(36)+(uidN++).toString(36)+Math.random().toString(36).slice(2,6);
function docRef(c,id){return{id,path:c+"/"+id,
  get:async()=>{await ready;const d=(cache[c]||{})[id];return{id,exists:!!d,data:()=>cl(d),metadata:{fromCache:false,hasPendingWrites:false}}},
  set:d=>write(c,id,d),update:d=>write(c,id,Object.assign({},(cache[c]||{})[id]||{},d)),delete:()=>write(c,id,null),
  onSnapshot(next,err){const s={coll:c,last:new Map(),fired:false,next:sn=>{const x=sn.docs.find(z=>z.id===id);next(x||{id,exists:false,data:()=>undefined})}};subs.push(s);ready.then(()=>emit(c)).catch(e=>err&&err({code:"unavailable",message:e.message}));return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}}}
function collRef(c){const q={path:c,doc:id=>docRef(c,id||uidx()),add:async d=>{const id=uidx();await write(c,id,d);return docRef(c,id)},
  where:()=>q,orderBy:()=>q,limit:()=>q,
  get:async()=>{await ready;const m=cache[c]||{};const docs=Object.keys(m).map(id=>mk(id,m[id]));return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}},
  onSnapshot(next,err){const s={coll:c,last:new Map(),fired:false,next};subs.push(s);ready.then(()=>{const sn=snapFor(s);if(sn)next(sn)}).catch(e=>err&&err({code:"unavailable",message:e.message}));return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}};return q}
const db={doc:p=>{const[c,id]=String(p).split("/");return docRef(c,id)},collection:c=>collRef(c)};
setInterval(async()=>{if(document.hidden||inflight||rev<0)return;try{const j=await jget("/api/desk/rev");if(j.rev!==rev&&!inflight)await loadAll()}catch(e){}},2500);
const assets={upload:async(blob,o)=>{const j=await jpost("/api/desk/upload",blob,(blob&&blob.name)||(o&&o.name)||"file.bin");if(j.error)throw Object.assign(new Error(j.error),{code:"invalid_request"});return Object.assign(j,{contentType:blob.type||j.contentType})},
  delete:async id=>{await jpost("/api/desk/delfile",{id:String(id).replace("/_blob/","")});return{ok:true}},list:async()=>({assets:[],usage:{}})};
const downloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename||"file";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return{saved:true}}};
let ME="Me";jget("/api/presence").then(j=>{if(j&&j.me)ME=String(j.me).replace(/\s*\(server\)$/,"")}).catch(()=>{});
const user={id:async()=>"local",me:async()=>({id:"local",name:ME}),profiles:async ids=>Object.fromEntries((ids||[]).map(i=>[i,{id:i,name:i==="local"?ME:"Member"}])),isOwner:()=>true,canEdit:()=>true,can:()=>true};
/* Trợ lý: dùng LLM của app (/api/run), gọi công cụ của trang qua JSON */
const LLM_DEF="openai/gpt-6-sol";
const llmModel=()=>{try{return localStorage.getItem("kd_llm")||LLM_DEF}catch(e){return LLM_DEF}};
async function waitJob(id,signal){for(let i=0;i<900;i++){if(signal&&signal.aborted)throw{code:"cancelled",message:"Stopped"};const j=await jget("/api/job?id="+encodeURIComponent(id));
    if(j.status==="done")return j;if(j.status&&j.status!=="running")throw{code:"upstream_error",message:j.error||("Job "+j.status)};await new Promise(r=>setTimeout(r,i<10?700:1500))}throw{code:"upstream_error",message:"Timed out"}}
function pj(t){t=String(t||"").trim();const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m)t=m[1];const a=t.indexOf("{"),b=t.lastIndexOf("}");try{return JSON.parse(a>=0?t.slice(a,b+1):t)}catch(e){return{reply:t,calls:[]}}}
async function sample(input,opts){opts=opts||{};const msgs=typeof input==="string"?[{role:"user",content:input}]:input;const tools=opts.tools||[];
  const sys=`Bạn là trợ lý trong app KTOONSTUDIO. Bạn KHÔNG trực tiếp thấy dữ liệu; muốn đọc hay sửa thì gọi công cụ.
Mỗi lượt trả về DUY NHẤT một JSON: {"calls":[{"name":"<tên công cụ>","input":{...}}],"reply":"<lời nhắn cho người dùng>"}.
- Cần dữ liệu hoặc cần thay đổi: điền "calls" (có thể nhiều), "reply" để trống. Bạn sẽ nhận KẾT QUẢ rồi được hỏi tiếp.
- Khi đã đủ: "calls": [] và "reply" là câu trả lời cuối (tiếng Việt, ngắn gọn, có thể dùng gạch đầu dòng "- " và **đậm**).
- Không bịa kết quả công cụ. Không gọi lại công cụ đã có kết quả nếu không cần.
CÔNG CỤ:
${tools.map(t=>`• ${t.name}: ${t.description}${t.inputSchema?`\n  input: ${JSON.stringify(t.inputSchema.properties||{})}`:" (no input needed)"}`).join("\n")}`;
  let convo=msgs.map(m=>`${m.role==="assistant"?"TRỢ LÝ":"NGƯỜI DÙNG"}:\n${m.content}`).join("\n\n");let out="",total=0;
  for(let round=0;round<8;round++){if(opts.signal&&opts.signal.aborted)throw{code:"cancelled",message:"Stopped"};
    if(opts.onText)opts.onText({text:(out?out+"\n\n":"")+(round?"…working":"Thinking…"),delta:""});
    const r=await jpost("/api/run",{kind:"llm",model:llmModel(),json_mode:true,nocore:true,scope:"chat",node:"__desk__",system:sys,texts:[convo],images:[],extra:"",prompt:"Trả JSON đúng hợp đồng cho lượt tiếp theo."});
    if(r.error)throw{code:/Cap exceeded/.test(r.error)?"rate_limited":"upstream_error",message:r.error,text:out};
    const j=await waitJob(r.job,opts.signal);total+=+j.cost||0;const o=pj((j.output||{}).text);const calls=Array.isArray(o.calls)?o.calls:[];
    if(calls.length){for(const c of calls){const t=tools.find(x=>x.name===c.name);let res;try{res=t?await t.execute(c.input||{},{signal:opts.signal||new AbortController().signal}):"Error: no such tool"+c.name}catch(e){res="Error: "+(e&&e.message||e)}
        let s=typeof res==="string"?res:JSON.stringify(res);if(s.length>14000)s=s.slice(0,14000)+"…[cut]";convo+=`\n\nKẾT QUẢ ${c.name}(${JSON.stringify(c.input||{})}):\n${s}`}
      if(o.reply)out+=(out?"\n\n":"")+o.reply;continue}
    out+=(out?"\n\n":"")+(o.reply||"");break}
  const text=(out.trim()||"(No reply)")+(total?`\n\n(${llmModel().split("/")[1]} · $${total.toFixed(4)})`:"");if(opts.onText)opts.onText({text,delta:""});return{text,truncated:false}}
sample.limits=async()=>({images:false});
const NS={db,assets,downloads,user,sample,mcp:null};
ready=loadAll();
window.claude={use:async n=>{if(n==="db"){try{await ready}catch(e){return null}}return NS[n]||null}};
window.KD_APP=true;
})();
</script>
</head><body>
<title>KTOONSTUDIO Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen studio desk — slate header with project switcher, tab rail, then working panels (form left, live output right). */
:root{
  --bg:#F2F5F2; --surface:#FFFFFF; --sunk:#E8EDE9; --ink:#13201A; --muted:#5B6A62; --line:#D8E0DA;
  --accent:#1E8A4C; --accent-ink:#FFFFFF; --accent-soft:#DFF1E6;
  --warn:#A86A12; --warn-soft:#FBEFD9; --bad:#B83A2C; --bad-soft:#F8E2DE; --good:#1E8A4C;
  --s1:#1E8A4C; --s2:#2A8C8C; --s3:#3E6FB0; --s4:#B9822A; --s5:#7A8790; --s6:#7B5EA7;
  --f-display:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#16201B; --sunk:#111915; --ink:#E4ECE7; --muted:#91A198; --line:#26332C;
  --accent:#3DBB70; --accent-ink:#04120A; --accent-soft:#173323;
  --warn:#E2A94B; --warn-soft:#352812; --bad:#E86B5C; --bad-soft:#3A1C18; --good:#3DBB70;
  --s1:#3DBB70; --s2:#3FB3B0; --s3:#6E9BE0; --s4:#E0A84A; --s5:#8D9AA3; --s6:#A68BD6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#16201B; --sunk:#111915; --ink:#E4ECE7; --muted:#91A198; --line:#26332C;
  --accent:#3DBB70; --accent-ink:#04120A; --accent-soft:#173323;
  --warn:#E2A94B; --warn-soft:#352812; --bad:#E86B5C; --bad-soft:#3A1C18; --good:#3DBB70;
  --s1:#3DBB70; --s2:#3FB3B0; --s3:#6E9BE0; --s4:#E0A84A; --s5:#8D9AA3; --s6:#A68BD6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700}
h3{font-size:14px;font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Slate header */
.slate{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 20px/1 var(--f-display);flex:none}
.brand{display:grid;line-height:1.15;min-width:0}
.brand b{font:800 16px var(--f-display);letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted)}
.slate .grow{flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.on{background:var(--good)}
.projsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.projsel select{min-width:180px}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Controls */
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input[type=checkbox]{width:auto}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
label.f.inline{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fields .wide{grid-column:1/-1}
.sec{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:4px;border-top:1px solid var(--line);margin-top:4px}
.sec:first-child{border:0;margin:0;padding:0}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:2px}
.kpi small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi b{font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}

.flags{display:grid;gap:6px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--sunk);font-size:13px}
.flag::before{content:"";width:4px;align-self:stretch;border-radius:2px;background:var(--muted);flex:none}
.flag.warn{background:var(--warn-soft)}.flag.warn::before{background:var(--warn)}
.flag.bad{background:var(--bad-soft)}.flag.bad::before{background:var(--bad)}
.flag.ok{background:var(--accent-soft)}.flag.ok::before{background:var(--good)}

table{border-collapse:collapse;width:100%}
.tw{overflow-x:auto}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
tr.total td{font-weight:700;border-top:2px solid var(--ink)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.g{background:var(--accent-soft);color:var(--good)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.b{background:var(--bad-soft);color:var(--bad)}

/* Docs */
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;background:var(--sunk)}
.drop.over{border-color:var(--accent);color:var(--ink)}
.namebox{font-family:var(--f-mono);font-size:13px;padding:9px 10px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);overflow-wrap:anywhere}
.doclist{display:grid;gap:0}
.doc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.doc .nm{font-family:var(--f-mono);font-size:12.5px;font-weight:600;overflow-wrap:anywhere}
.doc .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.doc .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:start}
.doc .body{grid-column:1/-1;white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:10px;font-size:13px}
.doc img.thumb{grid-column:1/-1;max-height:220px;width:auto;border-radius:8px;border:1px solid var(--line)}

.log{border-left:3px solid var(--accent);padding:4px 0 4px 12px;display:grid;gap:6px}
.log dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;margin:0;font-size:13px}
.log dt{color:var(--muted);font-weight:600}
.log dd{margin:0;white-space:pre-wrap}

/* Gantt */
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.g-in{position:relative}
.g-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line);min-height:34px}
.g-row:last-child{border-bottom:0}
.g-lab{padding:8px 10px;font-size:12.5px;font-weight:600;border-right:1px solid var(--line);background:var(--surface);position:sticky;left:0;z-index:1}
.g-track{position:relative}
.g-bar{position:absolute;top:7px;height:20px;border-radius:5px;font-size:10.5px;color:#fff;padding:2px 5px;overflow:hidden;white-space:nowrap;font-weight:700}
.g-head{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line);background:var(--sunk)}
.g-days{position:relative;height:26px}
.g-days span{position:absolute;top:5px;font-size:10px;color:var(--muted);font-family:var(--f-mono);transform:translateX(2px)}
.g-dl{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stcell{cursor:pointer;user-select:none}

.stale{position:sticky;top:0;z-index:20;background:var(--warn-soft);color:var(--warn);padding:8px 16px;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:600}
/* Workspace & views */
body.drawer-open #chat{right:440px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:9;display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-8px 0 24px rgb(0 0 0 / .12)}
#drawer[hidden]{display:none!important}
.dr-body{overflow-y:auto;padding:14px;display:grid;gap:12px;align-content:start}
.dr-body .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.dr-title{font:700 17px var(--f-display);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0;background:transparent}
.ckrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.cm{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:13px;display:grid;gap:2px;white-space:pre-wrap}
.cms,.ck,.files{display:grid;gap:6px}
.mention{color:var(--accent)}
.linkrow{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;padding:5px 2px;border-bottom:1px dashed var(--line);cursor:pointer;font-size:13px}
.linkrow:hover{color:var(--accent)}
.pal{display:flex;flex-wrap:wrap;gap:4px}.pal .btn{gap:5px}
.node{width:300px}.node.w-task{width:300px}.node.w-project{width:320px}.node.w-person{width:300px}.node.w-note{width:260px}
.node.sel{outline:2.5px solid var(--accent);outline-offset:2px}
.node .ncomp{display:grid;gap:4px}
.nv-edges path.e-contain{stroke:var(--line);stroke-width:2.5}
.nv-edges path.e-dep{stroke:var(--accent);stroke-width:2.5}
.nv-edges path.e-assign{stroke:var(--s4);stroke-dasharray:6 5;stroke-width:2}
.nv-edges path.e-attach{stroke:var(--muted);stroke-dasharray:2 5;stroke-width:2}
.nv-edges .ah{fill:var(--accent)}
.ws-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:10px;pointer-events:auto;padding:16px}
.pbar{height:6px;background:var(--sunk);border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent)}
.tabsep{align-self:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 6px 0 14px;white-space:nowrap}
.fbar{display:flex;flex-wrap:wrap;gap:8px}.fbar select{width:auto}.fbar input{flex:1;min-width:160px}
.st{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.st-doing{background:color-mix(in srgb,var(--s3) 22%,transparent);color:var(--s3)}
.st-review{background:var(--warn-soft);color:var(--warn)}
.st-blocked{background:var(--bad-soft);color:var(--bad)}
.st-done{background:var(--accent-soft);color:var(--good)}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:10px;overflow-x:auto;align-items:start;padding-bottom:6px}
.kcol{background:var(--sunk);border-radius:10px;padding:8px;display:grid;gap:8px;min-height:140px;border:2px solid transparent}
.kcol.over{border-color:var(--accent)}
.kh{display:flex;gap:6px;align-items:center;padding:2px 4px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px;cursor:grab}
.kc:hover{border-color:var(--accent)}.kc.dragging{opacity:.4}
.kc-t{font-weight:600;font-size:13px}
.kadd{justify-self:start;background:transparent}
.av{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;color:#fff;font-size:10px;font-weight:700}
.bad{color:var(--bad)}
.ltable td,.ltable th{white-space:nowrap}.ltable td:first-child{white-space:normal;min-width:180px}
.sortable{cursor:pointer;user-select:none}.lrow{cursor:pointer}.lrow:hover{background:var(--sunk)}
.grow td{background:var(--sunk)}
.gantt2{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.g2{position:relative}
.g2h,.g2r{display:grid;grid-template-columns:240px 1fr;border-bottom:1px solid var(--line)}
.g2h{background:var(--sunk);position:sticky;top:0;z-index:2}
.g2l{position:sticky;left:0;background:var(--surface);z-index:1;padding:5px 8px;font-size:12.5px;border-right:1px solid var(--line);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.g2h .g2l{background:var(--sunk)}
.g2r.l1 .g2l{padding-left:20px}.g2r.l2 .g2l{padding-left:34px}
.g2r.k-project .g2l,.g2r.k-label .g2l{background:var(--sunk)}
.g2d{position:relative;height:30px}
.g2h .g2d span{position:absolute;top:6px;text-align:center;font:10px var(--f-mono);color:var(--muted)}
.g2h .g2d span b{display:block;position:absolute;top:-6px;left:2px;font-size:9px;color:var(--ink)}
.g2h .g2d span.sun{color:var(--bad)}
.gt{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.gb{position:absolute;top:6px;height:18px;border-radius:4px;font-size:10px;color:#fff;padding:1px 5px;overflow:hidden;white-space:nowrap;cursor:pointer;background:var(--s5)}
.gb.st-todo{background:var(--s5);color:#fff}.gb.st-doing{background:var(--s3);color:#fff}.gb.st-review{background:var(--s4);color:#fff}.gb.st-blocked{background:var(--bad);color:#fff}
.gb.gb-done{background:var(--accent);opacity:.5}
.gb.late{background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgb(255 255 255 / .25) 6px 9px)}
.gb.crit{outline:2px solid var(--bad);outline-offset:1px}
.gsum{position:absolute;top:12px;height:6px;border-radius:3px;background:var(--ink);opacity:.55}
.gd{position:absolute;top:9px;width:10px;height:10px;background:var(--bad);transform:rotate(45deg)}
.gm{position:absolute;top:7px;width:14px;height:14px;background:var(--s6);transform:rotate(45deg);border-radius:2px}.gm.late{background:var(--bad)}
.legend i.st-todo{background:var(--s5)}.legend i.st-doing{background:var(--s3)}.legend i.st-review{background:var(--s4)}.legend i.st-blocked{background:var(--bad)}
.legend i.gm-l{background:var(--s6);transform:rotate(45deg)}.legend i.gd-l{background:var(--bad);transform:rotate(45deg)}
.seg{display:flex;gap:4px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mh{background:var(--sunk);padding:6px;font-size:11.5px;font-weight:700;color:var(--muted)}
.mc{background:var(--surface);min-height:96px;padding:4px;display:grid;gap:2px;align-content:start;cursor:pointer;min-width:0}
.mc.out{background:var(--sunk);opacity:.7}.mc.now .md{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 6px}
.md{font-size:11.5px;font-weight:700;justify-self:start}
.chip{font-size:11px;padding:1px 5px;border-radius:4px;background:var(--sunk);border-left:3px solid var(--s3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.chip.ms{border-left-color:var(--s6);font-weight:700}.chip.dl{border-left-color:var(--bad);color:var(--bad)}
.wcal{display:grid;gap:0;overflow-x:auto}
.wc-h{display:grid;grid-template-columns:52px repeat(var(--n,7),minmax(110px,1fr));font-size:12px}
.wc-h>div{padding:4px 6px;border-bottom:1px solid var(--line)}.wc-h .now{color:var(--accent)}
.wc-tags{display:grid;gap:2px;margin-top:2px}
.wc-b{position:relative;display:grid;grid-template-columns:52px repeat(var(--n,7),minmax(110px,1fr))}
.wc-axis{position:relative}.wc-axis span{position:absolute;right:6px;font:10px var(--f-mono);color:var(--muted);transform:translateY(-6px)}
.wc-col{position:relative;border-left:1px solid var(--line)}
.wc-col .hl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.wb{position:absolute;border-radius:5px;color:#fff;font-size:10.5px;padding:2px 4px;overflow:hidden;cursor:pointer;display:grid;align-content:start;line-height:1.25}
.wb b{font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.wb span{opacity:.9;white-space:nowrap}
table.load td,table.load th{text-align:center;padding:4px}
table.load th.now{color:var(--accent)}
.lc{cursor:pointer;font-size:12px;min-width:52px}.lc span{color:var(--muted);font-size:10.5px}
.lc.off{color:var(--muted);font-size:11px;background:var(--sunk)}
.lc.ld-0{background:var(--surface)}.lc.ld-1{background:color-mix(in srgb,var(--accent) 14%,transparent)}.lc.ld-2{background:color-mix(in srgb,var(--accent) 34%,transparent)}.lc.ld-3{background:var(--bad-soft);color:var(--bad)}
.legend i.ld-0{background:var(--surface);border:1px solid var(--line)}.legend i.ld-1{background:color-mix(in srgb,var(--accent) 14%,transparent)}.legend i.ld-2{background:color-mix(in srgb,var(--accent) 34%,transparent)}.legend i.ld-3{background:var(--bad-soft)}
/* Canvas controls (theo KTOONSTUDIO app) */
.nv-stage{outline:none}
.nv-stage.spacing{cursor:grab}
.nv-tools{position:absolute;left:10px;top:10px;z-index:5;display:grid;gap:4px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 18px rgb(0 0 0 / .12)}
.nv-tools hr{border:0;border-top:1px solid var(--line);margin:2px 0}
.tool{display:grid;grid-template-columns:12px 1fr;grid-template-rows:auto auto;column-gap:5px;align-items:center;width:68px;padding:5px 6px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;color:var(--ink)}
.tool:hover{background:var(--sunk);border-color:var(--line)}
.tool i{width:12px;height:12px;border-radius:3px;grid-row:1}.tool b{font:700 11px var(--f-mono);color:var(--muted);grid-row:1}
.tool span{grid-column:1/-1;font-size:10px;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .iq{background:none;width:auto;height:auto;font-style:normal;font-weight:700;font-size:13px;line-height:12px}
.tool .ifr{border:1.5px dashed var(--muted);background:none}
.nv-status{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;gap:10px;align-items:center;padding:6px 10px;background:var(--surface);border-top:1px solid var(--line);font-size:12px;border-radius:0 0 12px 12px}
.nv-status .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:760px){.nv-status .hint{display:none}.nv-tools{grid-template-columns:repeat(2,auto)}}
.ws-empty{pointer-events:none;z-index:4}.ws-empty *{pointer-events:auto}
.ctx{position:absolute;z-index:8;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgb(0 0 0 / .22);padding:4px;display:grid}
.ctx button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--ink)}
.ctx button:hover:not([disabled]){background:var(--sunk)}.ctx button[disabled]{opacity:.4;cursor:default}
.ctx button i,.qadd button i{width:10px;height:10px;border-radius:3px;flex:none}
.ctx hr{border:0;border-top:1px solid var(--line);margin:3px 0}
.ctx kbd,.qadd kbd,.help kbd,.btn kbd{margin-left:auto;font:10.5px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--sunk)}
.cm-sub{position:relative}.cm-sm{display:none;position:absolute;left:100%;top:-4px;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgb(0 0 0 / .22);padding:4px}
.cm-sub:hover>.cm-sm,.cm-sub:focus-within>.cm-sm{display:grid}
.qadd{position:absolute;z-index:8;width:300px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;box-shadow:0 12px 30px rgb(0 0 0 / .25);padding:6px;display:grid;gap:4px}
.qadd #nvQl{display:grid;max-height:260px;overflow-y:auto}
.qadd button{display:flex;align-items:center;gap:8px;text-align:left;background:none;border:0;padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--ink)}
.qadd button.on,.qadd button:hover{background:var(--accent-soft)}
.help{position:absolute;z-index:8;right:12px;top:12px;width:min(420px,calc(100% - 24px));max-height:calc(100% - 70px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgb(0 0 0 / .22);padding:12px;display:grid;gap:8px;font-size:12.5px}
.help td{padding:4px 6px;border-bottom:1px solid var(--line)}
.frame{position:absolute;border:2px solid var(--fc);border-radius:12px;background:color-mix(in srgb,var(--fc) 7%,transparent);pointer-events:none}
.frame.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--fc) 35%,transparent)}
.frame .fh{pointer-events:auto;display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 10px;background:color-mix(in srgb,var(--fc) 22%,var(--surface));border-radius:10px 10px 0 0;cursor:grab}
.frame .ftitle{border:0;background:transparent;font:700 14px var(--f-display);padding:2px 4px;min-width:0;flex:1}
.frame .fs{font-size:11.5px;color:var(--muted);white-space:nowrap}
.rh{position:absolute;width:12px;height:12px;background:var(--surface);border:2px solid var(--accent);border-radius:3px;display:none;pointer-events:auto;z-index:3}
.node:hover>.rh,.node.sel>.rh,.frame.sel>.rh,.frame:hover>.rh{display:block}
.rh-n{top:-7px;left:calc(50% - 6px);cursor:ns-resize}.rh-s{bottom:-7px;left:calc(50% - 6px);cursor:ns-resize}
.rh-e{right:-7px;top:calc(50% - 6px);cursor:ew-resize}.rh-w{left:-7px;top:calc(50% - 6px);cursor:ew-resize}
.rh-ne{right:-7px;top:-7px;cursor:nesw-resize}.rh-sw{left:-7px;bottom:-7px;cursor:nesw-resize}
.rh-nw{left:-7px;top:-7px;cursor:nwse-resize}.rh-se{right:-7px;bottom:-7px;cursor:nwse-resize}
.node .rh-e,.node .rh-w{top:50%}
.marq{position:absolute;border:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);pointer-events:none;z-index:6}
.nv-world.lod .node .nb{display:none}
.nv-world.lod .node .nh{height:56px}.nv-world.lod .node .nh input{font-size:20px}
:root[data-theme="dark"] .nv-stage{background-color:#0A0F0C;background-image:radial-gradient(#1F2B25 1px,transparent 1.2px)}
:root[data-theme="dark"] .node{background:#141D18;border-color:#26332C;box-shadow:0 8px 22px rgb(0 0 0 / .45)}
:root[data-theme="dark"] .node .nh{background:#1A251F}
:root[data-theme="dark"] .nv-tools,:root[data-theme="dark"] .nv-status{background:#111915}
/* Node space */
body.nodemode .wrap{max-width:none}
body.nodemode #tabs{display:none}
.nodeview{display:grid;gap:8px;min-width:0}
.nv-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nv-stage{position:relative;height:calc(100vh - 190px);min-height:460px;overflow:hidden;border:1px solid var(--line);border-radius:12px;background-color:var(--sunk);background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:24px 24px;touch-action:none;cursor:grab}
.nv-stage.panning{cursor:grabbing}
.nv-world{position:absolute;left:0;top:0;transform-origin:0 0}
.nv-edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;color:var(--muted)}
.nv-edges path{fill:none;stroke:var(--muted);stroke-width:2.5;pointer-events:stroke;cursor:pointer}
.nv-edges path:hover{stroke:var(--accent)}
.nv-edges path.arm{stroke:var(--bad);stroke-dasharray:7 5}
.nv-edges path.tmp{stroke:var(--accent);stroke-dasharray:6 4;pointer-events:none}
.nv-edges .ah{fill:var(--muted);stroke:none}
.node{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 22px rgb(0 0 0 / .10);display:grid;cursor:default}
.node.drag{box-shadow:0 14px 34px rgb(0 0 0 / .2);z-index:3}
.node .nh{display:flex;align-items:center;gap:6px;height:40px;padding:0 8px 0 12px;border-bottom:1px solid var(--line);cursor:grab;border-radius:12px 12px 0 0;background:var(--sunk)}
.node .nh input.ntitle{border:0;background:transparent;font-weight:700;padding:3px 4px;flex:1;min-width:0}
.node .nh .pill{font-size:10.5px}
.ndot{width:10px;height:10px;border-radius:3px;flex:none}
.ndel{padding:2px 7px!important}.ndel.arm{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.node .nb{padding:10px 12px 12px;display:grid;gap:10px;font-size:13px}
.node .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.port{position:absolute;top:13px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent);z-index:2}
.port.in{left:-8px;border-color:var(--muted)}.port.out{right:-8px;cursor:crosshair}
.port.out:hover{background:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
.kv span{color:var(--muted)}.kv b.bad{color:var(--bad)}.kv b.good{color:var(--good)}
.mini{display:grid;gap:3px;font-size:12px}.mini>div{display:flex;justify-content:space-between;gap:8px}
.dh{font-weight:700;font-size:12.5px;margin-top:4px}
.node .agenda li{grid-template-columns:84px 10px minmax(0,1fr) auto auto;font-size:12px}
.wk th,.wk td{padding:3px 4px;font-size:12px;white-space:nowrap}
.wk input{min-width:92px;font-size:12px;padding:4px 6px}
.ovs{display:grid;gap:6px}.ov{display:grid;grid-template-columns:140px 110px minmax(0,1fr) auto;gap:6px;align-items:center}
@media (max-width:560px){.ov{grid-template-columns:1fr 1fr}.ov input:nth-of-type(2){grid-column:1/-1}}
/* Day schedule */
details.panel>summary{cursor:pointer;list-style:none}details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{content:"▸ ";color:var(--muted)}details.panel[open]>summary::before{content:"▾ "}
details.panel:not([open]){gap:0}
.days{display:grid;gap:12px}
.day{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;min-width:0}
.day.now{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.day.off{background:var(--sunk)}
.day-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.day-h .grow{flex:1}
.tl{display:grid;gap:3px}
.axis{position:relative;height:16px;margin-left:72px}
.axis span{position:absolute;font:10px var(--f-mono);color:var(--muted);transform:translateX(-50%)}
.lane{display:grid;grid-template-columns:68px 1fr;gap:4px;align-items:center}
.ln{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt{position:relative;height:22px;background:var(--sunk);border-radius:5px}
.shift{position:absolute;top:0;bottom:0;border:1px dashed var(--line);border-radius:5px;background:var(--surface)}
.blk{position:absolute;top:2px;bottom:2px;border-radius:4px;color:#fff;font:700 10px/18px var(--f-body);padding:0 4px;overflow:hidden;white-space:nowrap;cursor:pointer}
.blk.done{opacity:.45}
.agenda{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.agenda li{display:grid;grid-template-columns:96px 10px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px;padding:3px 4px;border-radius:6px}
.agenda li.stcell:hover{background:var(--sunk)}
.agenda li.muted{display:block}
.agenda .t{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.agenda i{width:10px;height:10px;border-radius:3px}
.agenda .who{font-size:12px;color:var(--muted)}
@media (max-width:560px){.agenda li{grid-template-columns:84px 10px minmax(0,1fr) auto}.agenda .who{display:none}}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;z-index:9;max-width:calc(100% - 32px)}
#chat{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:8;display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-8px 0 24px rgb(0 0 0 / .08)}
#chat[hidden]{display:none!important}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ch-log{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.ch-form{border-top:1px solid var(--line);padding:10px 14px;display:grid;gap:8px}
.msg{max-width:92%;padding:8px 11px;border-radius:10px;font-size:13.5px;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.a{align-self:flex-start;background:var(--sunk)}

<script>
(()=>{
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VND=n=>(isFinite(n)?Math.round(n):0).toLocaleString('vi-VN')+' ₫';
const USD=n=>'$'+(isFinite(n)?n:0).toFixed(2);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const pd=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const vn=d=>d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():'—';
const vnS=s=>vn(pd(s));
const ymd=s=>(s||today()).replace(/-/g,'');
const clean=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toUpperCase().replace(/[^A-Z0-9-]/g,'');
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':b>1024?Math.round(b/1024)+' KB':(b||0)+' B';
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const set=(o,p,v)=>{const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null||typeof a[k]!=='object')a[k]={};a=a[k]});a[ks.at(-1)]=v};

const TASKS=['KICHBAN','SHOTLIST','PROMPT','REFBANK','STB','VIDEO','DUNG','BAOGIA','HOPDONG','LICH','NHATKY','BIENBAN','KHAC'];
const STAGES=[
 {k:'script',l:'Script & shotlist',c:'var(--s1)'},
 {k:'ref',l:'Ref bank & STB',c:'var(--s2)'},
 {k:'gen',l:'Gen video & QC',c:'var(--s3)'},
 {k:'edit',l:'Edit & post',c:'var(--s4)'},
 {k:'review',l:'Client review',c:'var(--s5)'}];

const SCHED_DEF=()=>({hours:{script:2,ref:3,gen:5,edit:4},reviewDays:2,
  shifts:{me:'09:00-12:00, 13:30-18:00, 22:00-24:00',editor:'20:00-24:00'},people:{me:'Trường',editor:'Editor'},

function calc(p){const c=p.cost,m=c.mix,r=c.rate;
  const ms=(+m.ref||0)+(+m.i2v||0)+(+m.mini||0)||1;
  const blended=((+m.ref||0)*r.ref+(+m.i2v||0)*r.i2v+(+m.mini||0)*r.mini)/ms;
  const sec=+c.secPerEp||0,min=sec/60;
  const first=sec*blended,retake=first*(+c.retake||0)/100,waste=(first+retake)*(+c.waste||0)/100,img=(+c.imgPerMin||0)*min;
  const genUSD=first+retake+waste+img,fx=+c.fx||0,genVND=genUSD*fx;
  const fixed=(+c.fixedMonth||0)/((+c.epsMonth)||1),labor=(+c.laborMonth||0)/((+c.epsMonth)||1),other=+c.otherPerEp||0;
  const cost=genVND+fixed+labor+other;
  const mg=Math.min(+c.margin||0,95)/100;
  const suggest=Math.ceil(cost/(1-mg)/50000)*50000;
  const price=(+c.price>0)?+c.price:suggest;
  const eps=+c.eps||0;
  const gross=price*eps,disc=gross*(+c.discount||0)/100,net=gross-disc,vat=net*(+c.vat||0)/100,total=net+vat;
  const profit=net-cost*eps;
  const threshold=12*min; // quy tắc: >$60 cho tập 5 phút là lỗ
  return{ms,blended,sec,min,first,retake,waste,img,genUSD,genVND,fixed,labor,other,cost,suggest,price,eps,gross,disc,net,vat,total,profit,margin:net?profit/net:0,threshold}}

function isOff(d,s){const w=d.getDay();return(w===0&&s.sunOff)||(w===6&&s.satOff)}
function firstWork(d,s){const x=new Date(d);let g=0;while(isOff(x,s)&&g++<14)x.setDate(x.getDate()+1);return x}
function after(d,s){const x=new Date(d);x.setDate(x.getDate()+1);return firstWork(x,s)}
function span(start,n,s){let cur=firstWork(start,s),c=1;const st=new Date(cur);while(c<n){cur=after(cur,s);c++}return{s:st,e:cur}}
/* Lịch theo giờ: mỗi người có ca làm; khâu được xếp vào ca theo số giờ công / tập */
const toMin=t=>{const[h,m]=String(t).trim().split(/[:h.]/).map(Number);return(h||0)*60+(m||0)};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
function parseShifts(str){return String(str||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean).map(x=>{const[a,b]=x.split(/\s*[-–]\s*/);return[toMin(a),toMin(b)]}).filter(([a,b])=>b>a&&a>=0&&b<=1440).sort((x,y)=>x[0]-y[0])}
function normSched(p){const s=p.sched=p.sched||{},d=SCHED_DEF();
  if(!s.hours)s.hours=d.hours;if(s.reviewDays==null)s.reviewDays=(s.days&&s.days.review!=null)?s.days.review:d.reviewDays;
  s.shifts=Object.assign({},d.shifts,s.shifts);s.people=Object.assign({},d.people,s.people);s.assign=Object.assign({},d.assign,s.assign);
  s.weekly=s.weekly||{me:{},editor:{}};s.weekly.me=s.weekly.me||{};s.weekly.editor=s.weekly.editor||{};if(!Array.isArray(s.overrides))s.overrides=[];return s}
const isRest=v=>/ngh|off|^-$/i.test(String(v||''));
/* Ca của 1 người theo ngày: ngày đặc biệt > ca theo thứ > ca mặc định (trừ ngày nghỉ chung) */
function shiftFn(s,who){const def=parseShifts(s.shifts[who]),wk=(s.weekly||{})[who]||{},ov=s.overrides||[];
  return d=>{const k=iso(d);const o=ov.filter(x=>x&&x.date===k&&(x.who===who||x.who==='all')).pop();
    if(o)return isRest(o.shifts)||!String(o.shifts||'').trim()?[]:parseShifts(o.shifts);
    const w=wk[d.getDay()];if(w!=null&&String(w).trim()!=='')return isRest(w)?[]:parseShifts(w);
    return isOff(d,s)?[]:def}}
function alloc(cur,hours,fn){let need=Math.round(hours*60);const segs=[];const d=new Date(cur.d);let m=cur.m,g=0;
  if(need<=0)return{segs,end:{d:new Date(d),m}};
  while(need>0&&g++<400){{for(const[a,b]of fn(d)){const from=Math.max(a,m);if(from>=b)continue;const take=Math.min(b-from,need);segs.push({date:iso(d),from,to:from+take});need-=take;m=from+take;if(need<=0)break}}
    if(need>0){d.setDate(d.getDate()+1);m=0}}
  return{segs,end:{d:new Date(d),m}}}
const later=(a,b)=>!a?b:!b?a:(+a.d+a.m*6e4>=+b.d+b.m*6e4?a:b);
function schedule(p){const s=normSched(p),eps=+p.cost.eps||0,bs=Math.max(1,+s.batch||1),nb=Math.max(1,Math.ceil(eps/bs));
  const start=pd(s.start)||pd(today());const sh={me:shiftFn(s,'me'),editor:shiftFn(s,'editor')};
  const can={};['me','editor'].forEach(w=>{can[w]=false;const x=new Date(start);for(let i=0;i<21&&!can[w];i++){if(sh[w](x).length)can[w]=true;x.setDate(x.getDate()+1)}});
  const free={me:{d:start,m:0},editor:{d:start,m:0}};const R=[],days={};
  for(let b=0;b<nb;b++){const row=[];let prev=null;const from=b*bs+1,to=Math.min(eps,(b+1)*bs),n=Math.max(0,to-from+1);
    if(!s.overlap&&b>0){for(let j=3;j>=0;j--)if(R[b-1][j].endAt){prev=R[b-1][j].endAt;break}}
    for(let k=0;k<4;k++){const key=STAGES[k].k,who=s.assign[key]==='editor'?'editor':'me',hrs=(+s.hours[key]||0)*n;
      if(hrs<=0||!can[who]){row.push({s:null,e:null,segs:[],who,hours:0});continue}
      const r=alloc(later(free[who],prev),hrs,sh[who]);if(!r.segs.length){row.push({s:null,e:null,segs:[],who,hours:0});continue}free[who]=r.end;prev=r.end;
      r.segs.forEach(g=>{(days[g.date]=days[g.date]||[]).push({...g,who,stage:key,k,batch:b+1,eps:`${from}${to>from?'–'+to:''}`})});
      row.push({s:pd(r.segs[0].date),e:pd(r.segs.at(-1).date),segs:r.segs,who,hours:hrs,startAt:r.segs[0],endAt:r.end})}
    let deliver=null;for(let j=0;j<4;j++)if(row[j].e)deliver=row[j].e;
    const rd=+s.reviewDays||0;if(rd>0&&deliver){const sp=span(after(deliver,s),rd,s);row.push({s:sp.s,e:sp.e,segs:[],who:'client'})}else row.push({s:null,e:null,segs:[],who:'client'});
    R.push(Object.assign(row,{from,to,deliver,approve:row[4].e||deliver}))}
  Object.values(days).forEach(a=>a.sort((x,y)=>x.from-y.from));
  const end=R.reduce((a,r)=>{const e=r.approve||r.deliver;return e&&(!a||e>a)?e:a},null);
  return{R,days,start:firstWork(start,s),end,deadline:pd(s.deadline),people:s.people}}
function planSummary(p){const sc=schedule(p),st=p.st||{},nm=w=>w==='editor'?p.sched.people.editor:p.sched.people.me;
  const t0=today();const dates=Object.keys(sc.days).filter(d=>d>=t0).sort().slice(0,21);
  return{generatedAt:new Date().toISOString(),end:sc.end&&iso(sc.end),deadline:p.sched.deadline||null,
    days:dates.map(d=>({date:d,items:sc.days[d].map(x=>`${hm(x.from)}–${hm(x.to)} ${nm(x.who)} · ${STAGES[x.k].l} B${x.batch} (ep ${x.eps})${st[`b${x.batch}_${x.stage}`]==='done'?' [xong]':''}`)})),
    batches:sc.R.map((r,i)=>({batch:i+1,episodes:`${r.from}-${r.to}`,deliver:r.deliver&&iso(r.deliver),approve:r.approve&&iso(r.approve)}))}}

function calEvents(p,mode){const sc=schedule(p),ev=[],code=clean(p.code);

    else{const ed=emails((p.notify||{}).editor);r.forEach((x,k)=>{if(k>3||!x.segs)return;const nm=x.who==='editor'?p.sched.people.editor:p.sched.people.me;

async function syncCal(mode,cl){const p=P(),pid=S.cur,calId=((p.notify||{}).calId||'').trim();p.cal=p.cal||{};const map=p.cal[mode]=p.cal[mode]||{};

const RULES=()=>`Bạn là trợ lý điều phối sản xuất trong KTOONSTUDIO Desk, app quản lý dự án phim AI của Trường (KTOONSTUDIO, đội 2 người). Trả lời tiếng Việt, ngắn gọn, chuyên nghiệp.
NGUỒN CHÍNH là WORKSPACE (dự án → batch → task, nhân sự, mốc): đọc bằng ws_overview, sửa bằng ws_add_node / ws_update_node / ws_connect. Lịch task được app tự xếp theo giờ ước tính, thứ tự nối và ca làm của người làm. Khi được nhờ lập kế hoạch từ brief: tạo dự án, batch, các task có giờ ước tính, nối thứ tự, giao người, đặt mốc; sau đó báo ngày xong dự kiến và task nào trễ.

Hôm nay: ${today()}. Dự án đang mở: ${P()?P().name+' ('+S.cur+')':'none'}.
Cách làm:
- Luôn gọi get_state trước khi trả lời câu hỏi về số liệu hay trước khi sửa.
- Sửa thông số bằng update_project (đường dẫn dạng "cost.eps", "sched.start", ngày dạng YYYY-MM-DD, tiền VND là số nguyên, giá model là USD/giây). Đánh dấu tiến độ bằng set_stage_status. Ghi nhật ký bằng add_journal; lưu ghi chú bằng add_note.
- Khâu: script (kịch bản & shotlist), ref (ref bank & STB), gen (gen video & QC), edit (dựng & hậu kỳ), review (khách duyệt, tính theo ngày).

- Không tự gửi email hay mời khách: chỉ hướng dẫn Trường bấm nút ở tab "Email & Lịch khách".
- Yêu cầu mơ hồ hoặc xoá dữ liệu: hỏi lại trước khi làm. Không bịa số liệu.`;

   p.st=p.st||{};bs.forEach(x=>ss.forEach(y=>p.st[`b${x}_${y}`]=v));saveProject(S.cur);render();chTool(`Status ${b===0?'all batches':'B'+b} · ${st} → ${v}`);return'ok'}},
 {name:'ws_overview',description:'Đọc workspace quản lý dự án (nguồn chính): dự án, batch, task (trạng thái, người làm, giờ ước tính/thực tế, deadline, lịch dự kiến, trễ hay không), mốc, nhân sự và ca làm. Trả về JSON có id để dùng với các công cụ ws_*.',
  execute:()=>{const sc=wsSched();const T=t=>{const n=N(t),r=sc.R[t]||{};return{id:t,title:n.title,status:n.status,prio:n.prio,assignee:pname(assigneeOf(t))||null,est:+n.est||0,actual:+n.actual||0,deadline:n.deadline||null,plannedStart:r.start?`${r.start} ${hm(r.startMin)}`:null,plannedEnd:r.endDay?`${r.endDay} ${hm(r.endMin)}`:null,late:!!r.late,critical:sc.crit.has(t),phase:pname(phaseOf(t))||null}};
   return{today:today(),projects:allOf('project').map(p=>{const n=N(p),a=aggOf(p);return{id:p,title:n.title,code:n.code,status:n.status,deadline:n.deadline||null,budget:+n.budget||0,cost:costOf(p).total,progressPct:a.pct,plannedEnd:a.e,tasks:descOf(p,'task').map(T),phases:descOf(p,'phase').map(x=>({id:x,title:N(x).title})),milestones:descOf(p,'milestone').map(m=>({id:m,title:N(m).title,date:N(m).date,atRisk:sc.ms[m].late}))}}),
     looseTasks:allOf('task').filter(t=>!projectOf(t)).map(T),people:allOf('person').map(p=>({id:p,name:N(p).title,role:N(p).role,shifts:N(p).shifts,weekly:N(p).weekly,overrides:N(p).overrides,rate:+N(p).rate||0}))}}},
 {name:'ws_add_node',description:'Tạo node trong workspace. type: project|phase|task|milestone|person|client|cost|doc|note. fields: thuộc tính (task: title,status,prio,est,deadline,start,desc,tags; project: title,code,deadline,budget; milestone: title,date,kind; person: title,role,shifts,rate; cost: title,amount,kind). parent: id node chứa (dự án/batch); after: id task phải xong trước; assignee: id nhân sự. Trả về id mới.',
  inputSchema:{type:'object',properties:{type:{type:'string'},fields:{type:'object'},parent:{type:'string'},after:{type:'string'},assignee:{type:'string'}},required:['type']},
  execute:(inp)=>{const type=String(inp.type);if(!WT[type])throw new Error('invalid type');const ref=inp.parent&&N(inp.parent)?N(inp.parent):inp.after&&N(inp.after)?N(inp.after):null;
   const kids=inp.parent?outE(inp.parent).length:0;const f=inp.fields&&typeof inp.fields==='object'?inp.fields:{};const id=addNode(type,ref?(ref.x||0)+380:0,ref?(ref.y||0)+kids*60:Object.keys(W.nodes).length*40,f);
   if(inp.parent&&N(inp.parent))addEdge(inp.parent,id);if(inp.after&&N(inp.after))addEdge(inp.after,id);if(inp.assignee&&N(inp.assignee))addEdge(inp.assignee,id);
   chTool(`Add ${WT[type].l}: ${N(id).title}`);wsAfter(true);return{id}}},
 {name:'ws_update_node',description:'Sửa thuộc tính một node workspace theo id. changes: {field: value}, ví dụ {"status":"done"}, {"deadline":"2026-10-25","est":3}, với nhân sự {"shifts":"20:00-24:00","weekly":{"6":"nghỉ"}}. assignee: id nhân sự để giao task (chuỗi rỗng = bỏ giao).',
  inputSchema:{type:'object',properties:{id:{type:'string'},changes:{type:'object'},assignee:{type:'string'}},required:['id']},
  execute:(inp)=>{const n=N(String(inp.id));if(!n)throw new Error('No node'+inp.id);const ch=inp.changes&&typeof inp.changes==='object'?inp.changes:{};const done=[];
   for(const[k,v]of Object.entries(ch)){if(['type','x','y','createdAt'].includes(k))continue;const old=n[k];n[k]=typeof old==='number'?Number(v):v;if(n.type==='task'&&['status','deadline','prio'].includes(k)&&old!==v)hist(n,`${k}: ${old||'—'} → ${v||'—'} (Claude)`);done.push(`${k}=${typeof v==='object'?JSON.stringify(v):v}`)}
   if(n.type==='task'&&ch.status==='done'){n.progress=100;n.doneAt=Date.now()}
   if(inp.assignee!=null&&n.type==='task'){Object.entries(W.edges).forEach(([k,x])=>{if((x.a===inp.id||x.b===inp.id)&&N(x.a===inp.id?x.b:x.a)?.type==='person')delEdge(k)});if(inp.assignee&&N(inp.assignee))addEdge(inp.assignee,inp.id);done.push('assignee='+(pname(inp.assignee)||'—'))}
   saveNode(String(inp.id),true);chTool(`Edit ${n.title}: ${done.join(', ')}`);wsAfter(true);const r=wsSched().R[inp.id];return{ok:true,plannedEnd:r&&r.endDay||null,late:!!(r&&r.late)}}},
 {name:'ws_connect',description:'Nối hai node: dự án→batch/task (chứa), task→task (làm xong mới làm tiếp), nhân sự→task (giao việc), chi phí/tài liệu→node (gắn). remove=true để bỏ nối.',
  inputSchema:{type:'object',properties:{from:{type:'string'},to:{type:'string'},remove:{type:'boolean'}},required:['from','to']},
  execute:(inp)=>{const a=String(inp.from),b=String(inp.to);if(!N(a)||!N(b))throw new Error('id does not exist');
   if(inp.remove){[`${a}__${b}`,`${b}__${a}`].forEach(k=>{if(W.edges[k])delEdge(k)});chTool(`Unlink ${N(a).title} – ${N(b).title}`)}else{if(!addEdge(a,b))return'already linked';chTool(`Link ${N(a).title} → ${N(b).title}`)}wsAfter(true);return'ok'}},
 {name:'set_day_override',description:'Đặt ca riêng cho một ngày cụ thể (nghỉ, tăng ca, đổi ca). who là me | editor | all; shifts là "nghỉ" hoặc dạng "18:00-24:00". remove=true để xoá ngày đặc biệt đó.',
  inputSchema:{type:'object',properties:{date:{type:'string'},who:{type:'string',enum:['me','editor','all']},shifts:{type:'string'},remove:{type:'boolean'}},required:['date','who']},
  execute:(inp)=>{const p=P();if(!p)throw new Error('No projects yet');const s=normSched(p),date=String(inp.date),who=String(inp.who);
   if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw new Error('date must be YYYY-MM-DD');if(!['me','editor','all'].includes(who))throw new Error('invalid who');
   s.overrides=s.overrides.filter(o=>!(o.date===date&&o.who===who));
   if(!inp.remove){const sh=String(inp.shifts||'off');if(!isRest(sh)&&!parseShifts(sh).length)throw new Error('invalid shifts');s.overrides.push({date,who,shifts:sh})}
   saveProject(S.cur);render();chTool(`Day ${date} · ${who}: ${inp.remove?'remove special shift':inp.shifts||'off'}`);const x=snapshot();return{scheduleEnd:x.schedule.end,late:x.schedule.late}}},
 {name:'add_journal',description:'Thêm một mục nhật ký cho dự án đang mở (tên tự đặt theo quy ước). Các trường là văn bản; điền trường nào có nội dung.',
  inputSchema:{type:'object',properties:{date:{type:'string',description:'YYYY-MM-DD, mặc định hôm nay'},event:{type:'string'},decision:{type:'string'},numbers:{type:'string'},risks:{type:'string'},next:{type:'string'}}},
  execute:async(inp)=>{const p=P();if(!p)throw new Error('No projects yet');const d={projectId:S.cur,kind:'log',task:'NHATKY',date:/^\d{4}-\d{2}-\d{2}$/.test(inp.date||'')?inp.date:today(),createdAt:Date.now()};
   let any=false;LOGF.forEach(([k])=>{if(inp[k]){d[k]=String(inp[k]);any=true}});if(!any)throw new Error('Empty log');
   d.ver=nextVer(S.cur,'NHATKY');d.name=buildName(p,'NHATKY',d.date,d.ver);d.ext='.md';await putDoc(uid('log'),d);chTool('Saved'+d.name);if(S.tab==='log')rLog();return d.name}},
 {name:'add_note',description:'Lưu một ghi chú văn bản vào kho tài liệu của dự án đang mở, tên tự đặt KTOONS_<MÃ>_<TASK>_<NGÀY>_Vxx. task là chữ in hoa không dấu, ví dụ SHOTLIST, BIENBAN, KICHBAN.',
  inputSchema:{type:'object',properties:{task:{type:'string'},content:{type:'string'},date:{type:'string'}},required:['task','content']},
  execute:async(inp)=>{const p=P();if(!p)throw new Error('No projects yet');const task=clean(inp.task)||'KHAC',date=/^\d{4}-\d{2}-\d{2}$/.test(inp.date||'')?inp.date:today(),ver=nextVer(S.cur,task);
   const d={projectId:S.cur,kind:'note',task,date,ver,name:buildName(p,task,date,ver),ext:'.md',body:String(inp.content),createdAt:Date.now()};await putDoc(uid('d'),d);chTool('Saved'+d.name+'.md');if(S.tab==='docs')renderDocList();return d.name+'.md'}},
 {name:'open_project',description:'Chuyển sang dự án khác theo id (lấy từ get_state.projects), hoặc tạo dự án mới nếu truyền create_name (+ create_code).',
  inputSchema:{type:'object',properties:{id:{type:'string'},create_name:{type:'string'},create_code:{type:'string'}}},
  execute:(inp)=>{if(inp.create_name){const id=uid('p');S.projects[id]=newProject(String(inp.create_name),String(inp.create_code||inp.create_name));S.cur=id;saveProject(id);render();chTool('Create project'+inp.create_name);return{id}}
   if(!S.projects[inp.id])throw new Error('No project'+inp.id);S.cur=String(inp.id);render();chTool('Open'+S.projects[S.cur].name);return'ok'}},
 {name:'sync_calendar_internal',description:'Đồng bộ lịch nội bộ (từng khâu từng batch) của dự án đang mở lên Google Calendar của Trường. Không mời khách. Trả về số sự kiện tạo/cập nhật/xoá.',
  execute:async()=>{if(!S.mcp)throw new Error('Google Calendar is not available on this page');const r=await syncCal('int',[]);chTool(`Google Calendar: created ${r.c}, updated ${r.u}, deleted ${r.d}${r.fail?', failed'+r.fail:''}`);if(S.tab==='notify')rNotify();return r}}];
async function chSend(){const inp=$('#chIn'),text=inp.value.trim();if(!text||chatCtl)return;
  if(!S.sample&&window.claude&&window.claude.use){try{S.sample=await window.claude.use('sample')}catch(e){}}
  if(!S.sample){let st='unavailable';try{const pm=await window.claude.use('permissions');if(pm)st=await pm.state('sample')}catch(e){}
    if(st==='denied'){const m=chAdd('e','The page\'s "Ask Claude" permission is off. <button class="btn sm" id="chPerm">Open page permissions</button>');
      m.querySelector('#chPerm').onclick=async()=>{try{const pm=await window.claude.use('permissions');await pm.manage()}catch(e){chAdd('e','Open the page\'s Permissions menu (the shield / more icon above the page) and turn on Claude.')}}}
    else chAdd('e','The assistant is not ready. Press F5 to reload the page.');
    return}
  inp.value='';chAdd('u',esc(text).replace(/\n/g,'<br>'));chatLog.push({role:'user',content:text});
  const bub=chAdd('a','<span class="muted">Thinking…</span>');chatCtl=new AbortController();$('#chStop').hidden=false;$('#chSend').disabled=true;
  try{const msgs=[{role:'user',content:RULES()},{role:'assistant',content:'Đã rõ. Tôi sẽ đọc trạng thái trước khi trả lời hoặc sửa.'},...chatLog.slice(-16)];
    const{text:ans}=await S.sample(msgs,{tools:TOOLS,cache:false,signal:chatCtl.signal,onText:({text})=>{bub.innerHTML=chMd(text)}});
    bub.innerHTML=chMd(ans);chatLog.push({role:'assistant',content:ans})}
  catch(e){const m={not_granted:'This page is not allowed to ask Claude. Turn it on in the page\'s Permissions menu.',sampling_disabled:'Your account / organisation does not let pages call Claude.',capability_disabled:'Claude is not available in this view. Open the Desk link in a browser at claude.ai.',not_declared:'The page is running an old version. Press F5.',rate_limited:'Claude is busy, try again in a few minutes.',cancelled:'Stopped.',prompt_too_large:'The conversation is too long. Click "Clear chat" and ask again.'}[e&&e.code];
    if(e&&e.text){bub.innerHTML=chMd(e.text);chatLog.push({role:'assistant',content:e.text})}else bub.remove();chAdd('e',esc(m||'The assistant could not answer:'+(e&&(e.message||e.code))));
    if(!e||!e.text)chatLog.pop()}
  chatCtl=null;$('#chStop').hidden=true;$('#chSend').disabled=false;$('#chLog').scrollTop=1e9}
function chToggle(open){const c=$('#chat');c.hidden=!open;document.body.classList.toggle('chat-open',open);$('#chatBtn').setAttribute('aria-expanded',open);
  if(open){$('#chProj').textContent=P()?'Open:'+P().name:'';if(!chatLog.length&&!$('#chLog').children.length)chAdd('a',chMd('Hi Trường. I run on the app\'s LLM (costs go into the spend log). I read and edit the Desk data directly: settings, schedule, stage status, log, notes, and planning in the workspace.\n\n- "Move BH RED to 20/10, deadline 30/11 — will it make it?"\n- "12 episodes × 90 seconds at 1.2M VND/episode — what\'s the margin?"\n- "B1 finished script and refs, write today\'s log"'));$('#chIn').focus()}
  try{localStorage.setItem('kd_chat',open?'1':'0')}catch(e){}}
$('#chatBtn').onclick=()=>chToggle($('#chat').hidden);$('#chClose').onclick=()=>chToggle(false);
$('#chClear').onclick=()=>{chatLog.length=0;$('#chLog').innerHTML='';chToggle(true)};
$('#chStop').onclick=()=>chatCtl&&chatCtl.abort();
$('#chForm').onsubmit=e=>{e.preventDefault();chSend()};
$('#chIn').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();chSend()}};
$('#projPick').addEventListener('change',()=>{$('#chProj').textContent=P()?'Open:'+P().name:''});
try{if(localStorage.getItem('kd_chat')==='1'&&innerWidth>=1100)chToggle(true)}catch(e){}


(function(){const m=document.getElementById('chModel');if(!m)return;try{m.value=localStorage.getItem('kd_llm')||'openai/gpt-6-sol'}catch(e){}m.onchange=()=>{try{localStorage.setItem('kd_llm',m.value)}catch(e){}}})();
/* ---------- boot ---------- */
function setSync(on,txt){$('#syncDot').classList.toggle('on',on);$('#syncTxt').textContent=txt}
localLoad();render();setSync(false,'Saved in this browser');
if(window.claude&&window.claude.use){
  window.claude.use('db').then(db=>{if(!db){setSync(false,'Saved in this browser');return}
    S.db=db;S.live=true;S.projects={};S.docs={};W.nodes={};W.edges={};W.tpls={};wsTouch();setSync(true,'Saved on the KTOONSTUDIO server');render();
    const wsSnap=()=>{wsTouch();const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&(document.activeElement.closest('#main')||document.activeElement.closest('#drawer'));
      if(S.drawer){if(!N(S.drawer))closeDrawer();else renderDrawer()}
      if(S.mode==='node'){if(NVACT)return;if(typing){wsRefresh();return}clearTimeout(S.wsR);S.wsR=setTimeout(()=>{if(!NVACT)renderWS()},120)}
      else if((S.tab||'').startsWith('w-')&&!typing){clearTimeout(S.wsR);S.wsR=setTimeout(wsView,120)}};
    db.collection('nodes').onSnapshot(snap=>{snap.docChanges().forEach(c=>{if(c.type==='removed')delete W.nodes[c.doc.id];else if(!wTimers[c.doc.id]||!document.activeElement||!document.activeElement.closest('[data-nid="'+c.doc.id+'"]'))W.nodes[c.doc.id]=clone(c.doc.data())});wsSnap()},err=>setSync(false,'Sync error:'+(err.code||'')));
    db.collection('edges').onSnapshot(snap=>{const n={};snap.docs.forEach(d=>n[d.id]=clone(d.data()));W.edges=n;wsSnap()});
    db.collection('templates').onSnapshot(snap=>{const n={};snap.docs.forEach(d=>n[d.id]=clone(d.data()));W.tpls=n});
    db.collection('projects').onSnapshot(snap=>{const next={};snap.docs.forEach(d=>{next[d.id]=S.dirty[d.id]&&S.projects[d.id]?S.projects[d.id]:clone(d.data())});
      Object.keys(S.projects).forEach(id=>{if(S.dirty[id]&&!next[id])next[id]=S.projects[id]});S.projects=next;
      const typing=document.activeElement&&$('#main').contains(document.activeElement)&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if(S.mode==='node'||(S.tab||'').startsWith('w-'))return;
      if(typing){refreshOut();const pick=$('#projPick');if(pick&&!S.cur)render()}else render()},
      err=>setSync(false,'Sync error:'+(err.code||'')));
    db.collection('docs').onSnapshot(snap=>{const next={};snap.docs.forEach(d=>next[d.id]=clone(d.data()));S.docs=next;
      if(S.tab==='docs')renderDocList();else if(S.tab==='log'){const a=document.activeElement;if(!(a&&/TEXTAREA|INPUT/.test(a.tagName)))rLog()}else refreshOut()},
      err=>setSync(false,'Sync error:'+(err.code||'')));
  });
  window.claude.use('assets').then(a=>{S.assets=a;if(S.tab==='docs'&&a)rDocs()});
  window.claude.use('downloads').then(d=>{S.dl=d});
  window.claude.use('mcp').then(m=>{S.mcp=m});
  window.claude.use('user').then(async u=>{S.user=u;if(!u)return;try{S.meId=await u.id();const me=await u.me();if(me&&me.name)S.names[S.meId]=me.name}catch(e){}});
  window.claude.use('sample').then(s=>{S.sample=s;if(!s)$('#chatBtn').title='The assistant is not ready — press F5'});
}
})();
</script>
